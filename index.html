<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard Prototype</title>

<!-- Fonts: Inter Variable (UI) + Source Serif 4 (display) + JetBrains Mono (data) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;510;590;600&family=Source+Serif+4:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<!-- GridStack core CSS + JS (vendored for reliability) -->
<link rel="stylesheet" href="vendor/gridstack.min.css" />
<link rel="stylesheet" href="vendor/gridstack-extra.min.css" />
<script src="vendor/gridstack-all.js"></script>

<style>
  /* ============================================================
     Design tokens — refined dark theme
     ============================================================ */
  :root {
    /* Surfaces — V4 Hybrid (Linear dark canvas + Notion soft panels) */
    --bg:           #08090a;
    --bg-2:         #0d0e10;            /* barely-darker alt band */
    --bg-tint:      rgba(94, 106, 210, 0.06);
    --bg-grad:      radial-gradient(ellipse at top, #131a2c 0%, #08090a 60%);
    --panel:        rgba(255, 255, 255, 0.02);
    --panel-solid:  #0f1011;
    --panel-2:      #191a1b;
    --panel-3:      #232c44;
    --panel-tint:   rgba(94, 106, 210, 0.05);
    --border:       rgba(255, 255, 255, 0.08);   /* V4 whisper */
    --border-strong:rgba(255, 255, 255, 0.12);
    --border-accent:rgba(94, 106, 210, 0.4);

    /* Text — V4 4-tier */
    --text:         #f7f8f8;
    --text-2:       #d0d6e0;
    --muted:        #8a8f98;
    --muted-2:      #62666d;

    /* Brand — V4 indigo (Linear signature) */
    --accent:       #5e6ad2;          /* indigo violet */
    --accent-2:     #7170ff;          /* brighter */
    --accent-3:     #828fff;          /* hover */
    --accent-glow:  rgba(94, 106, 210, 0.35);
    --accent-soft:  rgba(94, 106, 210, 0.14);

    /* Semantic */
    --good:         #10b981;
    --bad:          #f87171;
    --warn:         #dd5b00;
    --warn-soft:    rgba(221, 91, 0, 0.10);

    /* Pill tints (V2 Notion pattern adapted for dark) */
    --tint-local:  rgba(255, 178, 135, 0.14);
    --tint-intl:   rgba(113, 122, 255, 0.16);
    --tint-tech:   rgba(155, 138, 255, 0.16);

    /* Shadows — V4 3-layer Notion-soft adapted for dark */
    --shadow-sm:    0 1px 2px rgba(0,0,0,0.4);
    --shadow-md:    0 4px 12px rgba(0,0,0,0.4);
    --shadow-lg:    0 8px 28px rgba(0,0,0,0.5);
    --shadow-card:  0 4px 18px rgba(0,0,0,0.20), 0 2px 8px rgba(0,0,0,0.15), 0 0.8px 3px rgba(0,0,0,0.10);
    --shadow-accent:0 0 0 1px var(--accent-soft), 0 8px 24px rgba(94, 106, 210, 0.20);

    /* Radius scale */
    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 12px;
    --r-xl: 16px;
    --r-full: 999px;

    /* Animation */
    --ease:   cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out: cubic-bezier(0.0, 0, 0.2, 1);
    --t-fast: 120ms;
    --t-med:  200ms;
    --t-slow: 320ms;

    /* Font family (overridable via settings) */
    --font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
               "PingFang HK", "Microsoft JhengHei", "Hiragino Sans GB", "Noto Sans CJK TC", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --font-serif: "Source Serif 4", "Source Serif Pro", "Source Han Serif TC", "Noto Serif CJK TC", Georgia, serif;

    /* Font size scale (overridable via settings) */
    --fs-base: 14px;
    --fs-scale: 1;        /* 1.0 default, can be 0.9 / 1.1 / 1.2 */
  }

  /* Light theme overrides (full token swap) */
  body.light {
    --bg:           #f7f8fc;
    --bg-2:         #eef0f7;
    --bg-tint:      rgba(99, 102, 241, 0.04);
    --bg-grad:      radial-gradient(ellipse at top, #ffffff 0%, #eef0f7 70%);
    --panel:        rgba(255, 255, 255, 0.88);
    --panel-solid:  #ffffff;
    --panel-2:      #f1f3f9;
    --panel-3:      #e8ebf3;
    --panel-tint:   rgba(99, 102, 241, 0.03);
    --border:       rgba(15, 23, 42, 0.08);
    --border-strong:rgba(15, 23, 42, 0.14);
    --border-accent:rgba(99, 102, 241, 0.4);

    --text:         #0f172a;
    --text-2:       #334155;
    --muted:        #64748b;
    --muted-2:      #94a3b8;

    --shadow-sm:    0 1px 2px rgba(15, 23, 42, 0.06);
    --shadow-md:    0 4px 12px rgba(15, 23, 42, 0.08);
    --shadow-lg:    0 12px 32px rgba(15, 23, 42, 0.12);
    --shadow-accent:0 0 0 1px var(--accent-soft), 0 8px 24px rgba(99, 102, 241, 0.20);
  }

  /* Per-theme color overrides — wider coverage (bg tint, panel tint, shadow hue) */
  body.theme-emerald {
    --accent: #10b981; --accent-2: #34d399; --accent-glow: rgba(16, 185, 129, 0.35); --accent-soft: rgba(16, 185, 129, 0.10); --border-accent: rgba(16, 185, 129, 0.4);
    --bg-tint: rgba(16, 185, 129, 0.08);
    --panel-tint: rgba(16, 185, 129, 0.05);
    --bg-grad: radial-gradient(ellipse at top, #102b25 0%, #0a0e1a 60%);
  }
  body.theme-rose {
    --accent: #f43f5e; --accent-2: #fb7185; --accent-glow: rgba(244, 63, 94, 0.35); --accent-soft: rgba(244, 63, 94, 0.10); --border-accent: rgba(244, 63, 94, 0.4);
    --bg-tint: rgba(244, 63, 94, 0.08);
    --panel-tint: rgba(244, 63, 94, 0.05);
    --bg-grad: radial-gradient(ellipse at top, #2a1218 0%, #0a0e1a 60%);
  }
  body.theme-amber {
    --accent: #f59e0b; --accent-2: #fbbf24; --accent-glow: rgba(245, 158, 11, 0.35); --accent-soft: rgba(245, 158, 11, 0.10); --border-accent: rgba(245, 158, 11, 0.4);
    --bg-tint: rgba(245, 158, 11, 0.08);
    --panel-tint: rgba(245, 158, 11, 0.05);
    --bg-grad: radial-gradient(ellipse at top, #2a1d08 0%, #0a0e1a 60%);
  }
  body.theme-cyan {
    --accent: #06b6d4; --accent-2: #22d3ee; --accent-glow: rgba(6, 182, 212, 0.35); --accent-soft: rgba(6, 182, 212, 0.10); --border-accent: rgba(6, 182, 212, 0.4);
    --bg-tint: rgba(6, 182, 212, 0.08);
    --panel-tint: rgba(6, 182, 212, 0.05);
    --bg-grad: radial-gradient(ellipse at top, #082a30 0%, #0a0e1a 60%);
  }
  body.theme-slate {
    --accent: #64748b; --accent-2: #94a3b8; --accent-glow: rgba(100, 116, 139, 0.35); --accent-soft: rgba(100, 116, 139, 0.10); --border-accent: rgba(100, 116, 139, 0.4);
    --bg-tint: rgba(100, 116, 139, 0.06);
    --panel-tint: rgba(100, 116, 139, 0.04);
    --bg-grad: radial-gradient(ellipse at top, #1e2330 0%, #0a0e1a 60%);
  }
  /* Light mode theme tints — each theme gets a soft pastel-tinted gradient */
  body.light.theme-emerald { --bg-grad: radial-gradient(ellipse at top, #ecfdf5 0%, #d1fae5 80%); --bg-tint: rgba(16, 185, 129, 0.06); --panel-tint: rgba(16, 185, 129, 0.04); }
  body.light.theme-rose    { --bg-grad: radial-gradient(ellipse at top, #fff1f2 0%, #ffe4e6 80%); --bg-tint: rgba(244, 63, 94, 0.06); --panel-tint: rgba(244, 63, 94, 0.04); }
  body.light.theme-amber   { --bg-grad: radial-gradient(ellipse at top, #fffbeb 0%, #fef3c7 80%); --bg-tint: rgba(245, 158, 11, 0.06); --panel-tint: rgba(245, 158, 11, 0.04); }
  body.light.theme-cyan    { --bg-grad: radial-gradient(ellipse at top, #ecfeff 0%, #cffafe 80%); --bg-tint: rgba(6, 182, 212, 0.06); --panel-tint: rgba(6, 182, 212, 0.04); }
  body.light.theme-slate   { --bg-grad: radial-gradient(ellipse at top, #f1f5f9 0%, #e2e8f0 80%); --bg-tint: rgba(100, 116, 139, 0.05); --panel-tint: rgba(100, 116, 139, 0.03); }
  body.light.theme-indigo  { --bg-grad: radial-gradient(ellipse at top, #eef2ff 0%, #e0e7ff 80%); --bg-tint: rgba(99, 102, 241, 0.06); --panel-tint: rgba(99, 102, 241, 0.04); }

  /* Font family variants */
  body.font-serif  { --font-ui: var(--font-serif); }
  body.font-mono   { --font-ui: var(--font-mono); }

  /* Font size scale variants */
  body.fs-compact    { --fs-scale: 0.88; }
  body.fs-comfortable{ --fs-scale: 1.0;  }
  body.fs-spacious   { --fs-scale: 1.15; }
  body.fs-roomy      { --fs-scale: 1.3;  }

  /* Per-widget font-size override (set via data-fs attribute on .grid-stack-item).
     Range: 0.7 to 1.5. Default 1.0 (inherits body). */
  .grid-stack-item[data-fs] { --fs-scale: 1; }  /* base scope; data-fs attribute below sets value */
  .grid-stack-item[data-fs="0.7"]  { --fs-scale: 0.7;  }
  .grid-stack-item[data-fs="0.8"]  { --fs-scale: 0.8;  }
  .grid-stack-item[data-fs="0.85"] { --fs-scale: 0.85; }
  .grid-stack-item[data-fs="0.9"]  { --fs-scale: 0.9;  }
  .grid-stack-item[data-fs="0.95"] { --fs-scale: 0.95; }
  .grid-stack-item[data-fs="1.0"]  { --fs-scale: 1.0;  }
  .grid-stack-item[data-fs="1.1"]  { --fs-scale: 1.1;  }
  .grid-stack-item[data-fs="1.2"]  { --fs-scale: 1.2;  }
  .grid-stack-item[data-fs="1.3"]  { --fs-scale: 1.3;  }
  .grid-stack-item[data-fs="1.4"]  { --fs-scale: 1.4;  }
  .grid-stack-item[data-fs="1.5"]  { --fs-scale: 1.5;  }

  /* Per-widget background color (set via data-bg attribute on .grid-stack-item) */
  .grid-stack-item[data-bg="emerald"] .widget { background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(16, 185, 129, 0.06)); border-color: rgba(16, 185, 129, 0.35); }
  .grid-stack-item[data-bg="rose"]    .widget { background: linear-gradient(135deg, rgba(244, 63, 94, 0.18), rgba(244, 63, 94, 0.06)); border-color: rgba(244, 63, 94, 0.35); }
  .grid-stack-item[data-bg="amber"]   .widget { background: linear-gradient(135deg, rgba(245, 158, 11, 0.18), rgba(245, 158, 11, 0.06)); border-color: rgba(245, 158, 11, 0.35); }
  .grid-stack-item[data-bg="cyan"]    .widget { background: linear-gradient(135deg, rgba(6, 182, 212, 0.18), rgba(6, 182, 212, 0.06)); border-color: rgba(6, 182, 212, 0.35); }
  .grid-stack-item[data-bg="indigo"]  .widget { background: linear-gradient(135deg, rgba(99, 102, 241, 0.18), rgba(99, 102, 241, 0.06)); border-color: rgba(99, 102, 241, 0.35); }
  .grid-stack-item[data-bg="slate"]   .widget { background: linear-gradient(135deg, rgba(100, 116, 139, 0.18), rgba(100, 116, 139, 0.06)); border-color: rgba(100, 116, 139, 0.35); }
  .grid-stack-item[data-bg="violet"]  .widget { background: linear-gradient(135deg, rgba(139, 92, 246, 0.18), rgba(139, 92, 246, 0.06)); border-color: rgba(139, 92, 246, 0.35); }
  /* In light mode, use stronger tints for visibility */
  body.light .grid-stack-item[data-bg="emerald"] .widget { background: linear-gradient(135deg, rgba(16, 185, 129, 0.28), rgba(16, 185, 129, 0.12)); border-color: rgba(16, 185, 129, 0.50); }
  body.light .grid-stack-item[data-bg="rose"]    .widget { background: linear-gradient(135deg, rgba(244, 63, 94, 0.28), rgba(244, 63, 94, 0.12)); border-color: rgba(244, 63, 94, 0.50); }
  body.light .grid-stack-item[data-bg="amber"]   .widget { background: linear-gradient(135deg, rgba(245, 158, 11, 0.28), rgba(245, 158, 11, 0.12)); border-color: rgba(245, 158, 11, 0.50); }
  body.light .grid-stack-item[data-bg="cyan"]    .widget { background: linear-gradient(135deg, rgba(6, 182, 212, 0.28), rgba(6, 182, 212, 0.12)); border-color: rgba(6, 182, 212, 0.50); }
  body.light .grid-stack-item[data-bg="indigo"]  .widget { background: linear-gradient(135deg, rgba(99, 102, 241, 0.28), rgba(99, 102, 241, 0.12)); border-color: rgba(99, 102, 241, 0.50); }
  body.light .grid-stack-item[data-bg="slate"]   .widget { background: linear-gradient(135deg, rgba(100, 116, 139, 0.28), rgba(100, 116, 139, 0.12)); border-color: rgba(100, 116, 139, 0.50); }
  body.light .grid-stack-item[data-bg="violet"]  .widget { background: linear-gradient(135deg, rgba(139, 92, 246, 0.28), rgba(139, 92, 246, 0.12)); border-color: rgba(139, 92, 246, 0.50); }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: var(--bg-grad);
    background-attachment: fixed;
    color: var(--text);
    font: calc(var(--fs-base) * var(--fs-scale)) / 1.5 var(--font-ui);
    font-feature-settings: "cv11", "cv01", "ss01", "ss03", "tnum";
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow: hidden;
    transition: background 0.3s var(--ease), color 0.3s var(--ease);
  }
  /* V4: serif display utility + mono data utility */
  .serif { font-family: var(--font-serif); font-feature-settings: "lnum"; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.08);
    border-radius: var(--r-full);
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.15); background-clip: padding-box; }

  /* ============================================================
     Header / page tabs
     ============================================================ */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    background: rgba(16, 20, 32, 0.7);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border);
    user-select: none;
    position: relative;
    z-index: 10;
  }
  header .brand {
    font-weight: 700;
    font-size: calc(15px * var(--fs-scale));
    margin-right: 16px;
    color: var(--text);
    letter-spacing: -0.01em;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  header .brand::before {
    content: '';
    width: 8px; height: 8px;
    border-radius: 2px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .tabs { display: flex; gap: 6px; flex: 1; overflow-x: auto; padding: 2px 0; }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: var(--r-md);
    cursor: pointer;
    white-space: nowrap;
    font-size: calc(13px * var(--fs-scale));
    font-weight: 500;
    transition: all var(--t-fast) var(--ease);
  }
  .tab:hover { color: var(--text-2); background: var(--panel-2); }
  .tab.active {
    color: var(--text);
    background: var(--panel-3);
    border-color: var(--border-strong);
    box-shadow: var(--shadow-sm);
  }
  .tab .x {
    color: var(--muted-2);
    font-size: calc(10px * var(--fs-scale));
    padding: 0 2px;
    border-radius: var(--r-sm);
    transition: all var(--t-fast) var(--ease);
  }
  .tab .x:hover { color: var(--bad); background: rgba(248, 113, 113, 0.1); }

  button.tool {
    background: var(--panel-2);
    color: var(--text-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 7px 14px;
    cursor: pointer;
    font: inherit;
    font-size: calc(13px * var(--fs-scale));
    font-weight: 500;
    transition: all var(--t-fast) var(--ease);
  }
  button.tool:hover { background: var(--panel-3); color: var(--text); border-color: var(--border-strong); }
  button.tool:active { transform: scale(0.98); }

  .menu { position: relative; }
  .menu-list {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    background: var(--panel-solid);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    min-width: 200px;
    padding: 4px;
    z-index: 50;
    display: none;
    box-shadow: var(--shadow-lg);
  }
  .menu.open .menu-list { display: block; }
  .menu-item {
    padding: 8px 12px;
    border-radius: var(--r-sm);
    cursor: pointer;
    font-size: calc(13px * var(--fs-scale));
    color: var(--text-2);
    transition: background var(--t-fast) var(--ease);
  }
  .menu-item:hover { background: var(--panel-3); color: var(--text); }
  .menu-sep { height: 1px; background: var(--border); margin: 4px 0; }

  /* ============================================================
     Grid container
     ============================================================ */
  .grid-wrap {
    position: absolute;
    inset: 60px 0 0 0;
    overflow: auto;
    padding: 16px;
  }
  .grid-stack {
    background: transparent;
    position: relative;
    min-height: 100%;
  }
  /* JS-drawn gridlines, sized to match GridStack cellWidth/cellHeight */
  .gs-line {
    position: absolute;
    background: rgba(255, 255, 255, 0.04);
    pointer-events: none;
    transition: background var(--t-fast) var(--ease);
  }
  .gs-line.v { top: 0; bottom: 0; width: 1px; }
  .gs-line.h { left: 0; right: 0; height: 1px; }
  .grid-stack.is-snapping .gs-line { background: rgba(99, 102, 241, 0.18); }

  /* GridStack placeholder during drag/resize */
  .grid-stack > .grid-stack-placeholder {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.18), rgba(167, 139, 250, 0.10)) !important;
    border: 1.5px dashed var(--accent) !important;
    border-radius: var(--r-lg) !important;
    z-index: 1 !important;
    opacity: 1 !important;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.08), 0 0 32px var(--accent-glow);
    transition: background 0.15s, box-shadow 0.15s;
  }
  .grid-stack > .grid-stack-placeholder > .placeholder-content {
    background: transparent !important;
    border: none !important;
    inset: 0 !important;
  }

  /* Cell coord label on the placeholder */
  .grid-stack > .grid-stack-placeholder::after {
    content: attr(data-coord);
    position: absolute;
    top: 8px; left: 10px;
    font: 600 10px/1 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color: var(--accent-2);
    background: rgba(10, 14, 26, 0.85);
    padding: 4px 8px;
    border-radius: var(--r-sm);
    pointer-events: none;
    letter-spacing: 0.3px;
    border: 1px solid var(--border-accent);
  }

  /* ============================================================
     Widget base — modern borderless design
     Header is hidden by default; settings & drag are accessed via
     right-click menu and floating button. Resize handle stays in corner.
     ============================================================ */
  /* V4: softer widget card (Notion-soft shadow on dark canvas) */
  .widget {
    background: var(--panel);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-card);
    transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
    position: relative;
  }
  .grid-stack-item:hover .widget {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-lg);
  }
  /* Header is invisible — drag handle is the widget body via GridStack handle config */
  .widget header.w-head {
    display: none;
  }
  /* Floating action button (settings) — top-right, fades in on hover */
  .widget .w-actions {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 2px;
    z-index: 5;
    opacity: 0;
    transition: opacity var(--t-fast) var(--ease);
    pointer-events: none;
  }
  .widget:hover .w-actions,
  .widget .w-actions.open,
  .widget .w-actions:focus-within { opacity: 1; pointer-events: auto; }
  .widget .w-actions .w-abtn {
    width: 22px; height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--r-sm);
    background: rgba(10, 14, 26, 0.6);
    backdrop-filter: blur(4px);
    color: var(--text-2);
    font-size: 12px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: all var(--t-fast) var(--ease);
  }
  .widget .w-actions .w-abtn:hover {
    background: var(--panel-3);
    color: var(--text);
    border-color: var(--border-strong);
  }
  .widget .w-actions .w-abtn.danger:hover { color: var(--bad); border-color: rgba(248, 113, 113, 0.4); }
  /* Body has extra top padding only when actions are visible — but we overlay */
  .widget .body {
    flex: 1;
    overflow: auto;
    padding: 14px 16px;
    position: relative;
  }

  /* Custom context menu (right-click) */
  .ctx-menu {
    position: fixed;
    background: var(--panel-solid);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-md);
    padding: 4px;
    min-width: 200px;
    box-shadow: var(--shadow-lg);
    z-index: 200;
    font-size: 13px;
    animation: ctx-fade-in 120ms var(--ease-out);
  }
  @keyframes ctx-fade-in { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .ctx-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-radius: var(--r-sm);
    cursor: pointer;
    color: var(--text-2);
    transition: background var(--t-fast) var(--ease);
    user-select: none;
  }
  .ctx-item:hover { background: var(--panel-3); color: var(--text); }
  .ctx-item.danger { color: var(--bad); }
  .ctx-item.danger:hover { background: rgba(248, 113, 113, 0.12); }
  .ctx-icon { width: 16px; text-align: center; opacity: 0.7; }
  .ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }

  /* ============================================================
     Weather widget
     ============================================================ */
  .w-weather .body { display: flex; flex-direction: column; gap: 8px; }
  .w-weather .wx-top {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .w-weather .wx-icon {
    width: 56px;
    height: 56px;
    color: var(--accent-2);
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    flex-shrink: 0;
  }
  .w-weather .wx-icon svg { width: 100%; height: 100%; }
  /* V4: serif display temp (Notion pattern) */
  .w-weather .temp {
    font-family: var(--font-serif);
    font-size: calc(52px * var(--fs-scale));
    font-weight: 700;
    line-height: 1;
    letter-spacing: -1.5px;
    color: var(--text);
    font-variant-numeric: lining-nums tabular-nums;
  }
  .w-weather .cond { color: var(--muted); font-size: calc(13px * var(--fs-scale)); font-weight: 500; }
  .w-weather .meta { display: flex; gap: 14px; color: var(--muted); font-size: calc(12px * var(--fs-scale)); flex-wrap: wrap; }
  .w-weather .meta span b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  /* V4: weather warning — left-border block (Notion callout pattern) */
  .w-weather .w-warn {
    color: var(--warn);
    padding: 8px 12px;
    background: var(--warn-soft);
    border-left: 3px solid var(--warn);
    border-radius: 0 var(--r-sm) var(--r-sm) 0;
    font-size: calc(12px * var(--fs-scale));
  }
  .w-weather .strip { display: flex; gap: 4px; margin-top: 6px; }
  /* V4: forecast day card — minimal V1 + V2 hybrid */
  .w-weather .day {
    flex: 1;
    text-align: center;
    background: transparent;
    border-radius: var(--r-sm);
    padding: 6px 2px;
    font-size: calc(10px * var(--fs-scale));
    color: var(--muted-2);
    border: 1px solid transparent;
    transition: all var(--t-fast) var(--ease);
    cursor: pointer;
  }
  .w-weather .day:hover { background: rgba(255,255,255,0.04); border-color: var(--border); }
  .w-weather .day .d-name {
    font-family: var(--font-mono);
    font-size: calc(9px * var(--fs-scale));
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted-2);
    font-weight: 600;
  }
  .w-weather .day b {
    display: block;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: calc(12px * var(--fs-scale));
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .w-weather .day .d-icon {
    width: 22px; height: 22px;
    color: var(--accent-2);
    margin: 2px auto;
  }
  .w-weather .day .d-icon svg { width: 100%; height: 100%; }
  /* Weather responsive (via [data-size] attribute) */
  /* Tiny: icon + temp only, no meta, no strip, no desc */
  .grid-stack-item.w-weather[data-size="tiny"]  .w-weather .meta,
  .grid-stack-item.w-weather[data-size="tiny"]  .w-weather .strip,
  .grid-stack-item.w-weather[data-size="tiny"]  .w-weather .cond,
  .grid-stack-item.w-weather[data-size="tiny"]  .w-weather .updated { display: none; }
  .grid-stack-item.w-weather[data-size="tiny"]  .w-weather .temp { font-size: calc(36px * var(--fs-scale)); }
  .grid-stack-item.w-weather[data-size="tiny"]  .w-weather .body { padding: 12px; justify-content: center; }
  .grid-stack-item.w-weather[data-size="tiny"]  .w-weather .wx-top { flex-direction: column; gap: 8px; align-items: flex-start; }
  /* Narrow: + desc + meta */
  .grid-stack-item.w-weather[data-size="narrow"] .w-weather .strip,
  .grid-stack-item.w-weather[data-size="narrow"] .w-weather .updated { display: none; }
  /* Normal: + meta + maybe strip on tall widgets */
  .grid-stack-item.w-weather[data-size="normal"] .w-weather .updated { display: none; }
  /* Wide: full content */
  .grid-stack-item.w-weather[data-size="wide"] .w-weather .temp { font-size: calc(72px * var(--fs-scale)); }
  .grid-stack-item.w-weather[data-size="xlarge"] .w-weather .temp { font-size: calc(88px * var(--fs-scale)); }
  .grid-stack-item.w-weather[data-size="xlarge"] .w-weather .meta { font-size: calc(14px * var(--fs-scale)); }
  .w-weather .day .bar {
    height: 3px;
    border-radius: var(--r-full);
    margin-top: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    opacity: 0.7;
  }
  .w-weather .updated {
    color: var(--muted-2);
    font-size: calc(10px * var(--fs-scale));
    margin-top: auto;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .w-warn {
    background: var(--warn-soft);
    color: var(--warn);
    border: 1px solid rgba(251, 191, 36, 0.25);
    border-radius: var(--r-sm);
    padding: 5px 10px;
    font-size: calc(12px * var(--fs-scale));
    font-weight: 500;
  }

  /* ============================================================
     Clock widget
     ============================================================ */
  .w-clock .body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    overflow: hidden;
    min-height: 0;
    height: 100%;
  }
  /* V4: serif clock display (Notion pattern) */
  .w-clock .time {
    font-family: var(--font-serif);
    font-weight: 700;
    letter-spacing: -1.5px;
    font-variant-numeric: lining-nums tabular-nums;
    color: var(--text);
    flex-shrink: 0;
    line-height: 1;
  }
  .w-clock .time .sec { color: var(--accent-2); font-weight: 600; }
  .w-clock .date { color: var(--muted); font-size: calc(13px * var(--fs-scale)); font-weight: 500; }
  .w-clock .lunar { color: var(--muted-2); font-size: calc(11px * var(--fs-scale)); }
  .grid-stack-item.w-clock.style-hero .w-clock .time { font-size: calc(72px * var(--fs-scale)); }
  .grid-stack-item.w-clock.style-compact .w-clock .time { font-size: calc(40px * var(--fs-scale)); }
  .grid-stack-item.w-clock.style-minimal .w-clock .body { gap: 2px; }

  /* Clock responsive: applied via [data-size] attribute set by ResizeObserver */
  /* Tiny: time only (HH:MM, no seconds, no date, no lunar) */
  .grid-stack-item.w-clock[data-size="tiny"]  .w-clock .time { font-size: calc(32px * var(--fs-scale)); line-height: 1; }
  .grid-stack-item.w-clock[data-size="tiny"]  .w-clock .date,
  .grid-stack-item.w-clock[data-size="tiny"]  .w-clock .lunar { display: none !important; }
  .grid-stack-item.w-clock[data-size="tiny"]  .w-clock .body { gap: 0; padding: 6px 8px; overflow: hidden; min-height: 0; }
  /* Narrow: time + date, no lunar */
  .grid-stack-item.w-clock[data-size="narrow"] .w-clock .time { font-size: calc(40px * var(--fs-scale)); }
  .grid-stack-item.w-clock[data-size="narrow"] .w-clock .lunar { display: none; }
  .grid-stack-item.w-clock[data-size="narrow"] .w-clock .date { font-size: calc(11px * var(--fs-scale)); }
  /* Wide: time + date + lunar, larger time */
  .grid-stack-item.w-clock[data-size="wide"]  .w-clock .time { font-size: calc(96px * var(--fs-scale)); }

  /* ============================================================
     News widget
     ============================================================ */
  .grid-stack-item.w-news .w-news .body { padding: 0; display: flex; flex-direction: column; min-height: 0; }
  .grid-stack-item.w-news .w-news .body .news-list { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
  /* When marquee mode is on, the entire list scrolls vertically automatically.
     List HTML is duplicated (innerHTML) so the scroll loops seamlessly via translateY(-50%). */
  .grid-stack-item.w-news .w-news .body .news-list.marquee-mode {
    overflow: hidden;
  }
  .grid-stack-item.w-news .w-news .body .news-list.marquee-mode .inner-track {
    display: block;
    animation: news-list-scroll var(--marquee-duration, 60s) linear infinite;
    will-change: transform;
  }
  .grid-stack-item.w-news .w-news .body .news-list.marquee-mode:hover .inner-track {
    animation-play-state: paused;
  }
  /* Highlight the hovered item when scrolling is paused */
  .grid-stack-item.w-news .w-news .body .news-list.marquee-mode .item:hover {
    background: var(--panel-2);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .grid-stack-item.w-news .w-news .body .news-list.marquee-mode .item:hover .title-line {
    color: var(--accent-2);
  }
  @keyframes news-list-scroll {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
  /* Edge fade for marquee mode */
  .grid-stack-item.w-news .w-news .body .news-list.marquee-mode {
    mask-image: linear-gradient(180deg, transparent 0, #000 32px, #000 calc(100% - 32px), transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 32px, #000 calc(100% - 32px), transparent 100%);
  }
  .w-news .item {
    display: block;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: calc(13px * var(--fs-scale));
    line-height: 1.5;
    cursor: pointer;
    color: var(--text);
    text-decoration: none;
    transition: background var(--t-fast) var(--ease);
    position: relative;
  }
  .w-news .item:last-child { border-bottom: none; }
  .w-news .item:hover { background: rgba(255,255,255,0.025); }
  .w-news .item:hover .title-line { color: var(--accent-2); }
  .w-news .item .tags {
    display: inline-flex;
    gap: 4px;
    margin-right: 6px;
    align-items: center;
    flex-wrap: wrap;
    vertical-align: middle;
  }
  /* V4: pill badge pattern (Notion) — uppercase, lighter weight */
  .w-news .item .src,
  .w-news .item .cat-tag,
  .w-news .item .lang-tag {
    display: inline-flex;
    align-items: center;
    font-size: calc(10px * var(--fs-scale));
    font-weight: 600;
    padding: 2px 7px;
    border-radius: var(--r-full);
    color: white;
    letter-spacing: 0.04em;
    line-height: 1.3;
    text-transform: uppercase;
  }
  .w-news .item .cat-tag { color: white; }
  .w-news .item .lang-tag {
    background: var(--panel-3) !important;
    color: var(--text-2) !important;
    border: 1px solid var(--border-strong);
  }
  .w-news .item .lang-tag.lang-zh::before { content: ""; }
  .w-news .item .lang-tag.lang-en::before { content: ""; }
  .w-news .item .title-line {
    display: inline;
    font-weight: 400;
    transition: color var(--t-fast) var(--ease);
  }
  .grid-stack-item[data-size="tiny"] .widget .body { padding: 6px 8px; overflow: hidden; min-height: 0; }
  /* Tiny widgets: force the time (clock) to not overflow its container */
  .grid-stack-item[data-size="tiny"].w-clock .w-clock .body > * { flex-shrink: 0; max-width: 100%; }
  .grid-stack-item[data-size="tiny"].w-clock .w-clock .time { white-space: nowrap; }
  /* V4: news ts in mono */
  .w-news .item .ts {
    color: var(--muted-2);
    font-size: calc(10px * var(--fs-scale));
    margin-left: 4px;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  /* News responsive: applied via [data-size] attribute set by ResizeObserver */
  .grid-stack-item.w-news[data-size="tiny"] .w-news .item .lang-tag,
  .grid-stack-item.w-news[data-size="tiny"] .w-news .item .ts { display: none; }
  .grid-stack-item.w-news[data-size="wide"] .w-news .body .news-list:not(.marquee-mode) {
    column-count: 2;
    column-gap: 0;
  }
  .grid-stack-item.w-news[data-size="wide"] .w-news .body .news-list:not(.marquee-mode) .item {
    break-inside: avoid;
    border-right: 1px solid var(--border);
  }
  .grid-stack-item.w-news[data-size="xlarge"] .w-news .body .news-list:not(.marquee-mode) {
    column-count: 3;
  }

  /* ============================================================
     Note widget
     ============================================================ */
  .w-note .body { padding: 0; }
  .w-note textarea {
    width: 100%; height: 100%;
    background: transparent;
    color: var(--text);
    border: none;
    outline: none;
    resize: none;
    font: inherit;
    padding: 14px 16px;
    line-height: 1.6;
  }
  .w-note textarea::placeholder { color: var(--muted-2); }
  .grid-stack-item.w-note.size-sm .w-note textarea { font-size: calc(12px * var(--fs-scale)); }
  .grid-stack-item.w-note.size-md .w-note textarea { font-size: calc(14px * var(--fs-scale)); }
  .grid-stack-item.w-note.size-lg .w-note textarea { font-size: calc(18px * var(--fs-scale)); line-height: 1.7; }

  /* ============================================================
     Bus widget (KMB ETA list)
     ============================================================ */
  .w-bus .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .w-bus .bus-stop-name {
    font-size: calc(13px * var(--fs-scale));
    font-weight: 510;
    color: var(--text);
    letter-spacing: -0.13px;
    line-height: 1.3;
  }
  .w-bus .bus-stop-name .stop-no {
    font-family: var(--font-mono);
    font-size: calc(10px * var(--fs-scale));
    color: var(--muted-2);
    margin-left: 4px;
    font-variant-numeric: tabular-nums;
  }
  .w-bus .bus-meta {
    font-family: var(--font-mono);
    font-size: calc(10px * var(--fs-scale));
    color: var(--muted-2);
    font-variant-numeric: tabular-nums;
    display: flex; justify-content: space-between; align-items: center; gap: 6px;
  }
  .w-bus .bus-status {
    font-family: var(--font-mono);
    font-size: calc(9px * var(--fs-scale));
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted-2);
    white-space: nowrap;
  }
  .w-bus .bus-status.ok   { color: var(--good); }
  .w-bus .bus-status.warn { color: var(--warn); }
  .w-bus .bus-status.err  { color: var(--bad); }
  .w-bus .bus-list {
    display: flex; flex-direction: column;
    flex: 1; overflow-y: auto; min-height: 0;
  }
  .w-bus .bus-row {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 7px 8px;
    border-radius: var(--r-sm);
    font-size: calc(13px * var(--fs-scale));
    color: var(--text-2);
    transition: background var(--t-fast) var(--ease);
  }
  .w-bus .bus-row:hover { background: rgba(255,255,255,0.025); }
  .w-bus .bus-route {
    font-family: var(--font-mono);
    font-size: calc(12px * var(--fs-scale));
    font-weight: 600;
    color: var(--accent-2);
    background: rgba(113, 112, 255, 0.12);
    border-radius: var(--r-sm);
    text-align: center;
    padding: 3px 4px;
    font-variant-numeric: tabular-nums;
  }
  .w-bus .bus-dest {
    color: var(--text-2);
    font-weight: 400;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .w-bus .bus-eta {
    font-family: var(--font-mono);
    font-size: calc(12px * var(--fs-scale));
    color: var(--text);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .w-bus .bus-eta.eta-now { color: var(--good); }
  .w-bus .bus-eta.eta-soon { color: var(--warn); }
  .w-bus .bus-rmk {
    font-family: var(--font-mono);
    font-size: calc(9px * var(--fs-scale));
    color: var(--muted-2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .w-bus .bus-pick-stop {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px;
    color: var(--muted);
    text-align: center;
    padding: 16px;
  }
  .w-bus .bus-pick-stop .glyph { font-size: 32px; }
  .w-bus .bus-pick-stop .hint { font-size: 12px; }

  /* Bus stop picker inside settings modal */
  .bus-picker {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 320px; overflow: hidden;
  }
  .bus-picker input {
    background: var(--panel-2);
    border: 1px solid var(--border-strong);
    color: var(--text);
    border-radius: var(--r-sm);
    padding: 6px 10px;
    font: inherit;
    font-size: 13px;
    outline: none;
  }
  .bus-picker input:focus { border-color: var(--accent); }
  .bus-picker .results {
    flex: 1; overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    background: var(--panel-2);
    max-height: 240px;
  }
  .bus-picker .results .stop-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    padding: 6px 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-2);
  }
  .bus-picker .results .stop-row:hover { background: rgba(255,255,255,0.04); }
  .bus-picker .results .stop-row .stop-name { font-weight: 500; }
  .bus-picker .results .stop-row .stop-id { font-family: var(--font-mono); color: var(--muted-2); font-size: 10px; }
  .bus-picker .empty { padding: 12px; color: var(--muted); text-align: center; font-size: 12px; }
  .bus-picker .loading { padding: 12px; color: var(--muted); text-align: center; font-size: 12px; }
  .bus-routes-filter {
    display: flex; flex-wrap: wrap; gap: 4px;
    max-height: 160px; overflow-y: auto;
    padding: 6px; background: var(--panel-2); border-radius: var(--r-sm);
  }
  .bus-routes-filter .chip {
    display: inline-flex;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 3px 8px;
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-2);
    user-select: none;
  }
  .bus-routes-filter .chip.on {
    background: rgba(113, 112, 255, 0.20);
    border-color: var(--accent);
    color: var(--accent-2);
  }
  .bus-routes-filter .chip:hover { background: rgba(255,255,255,0.06); }

  /* ============================================================
     Text widget (decorative custom text)
     ============================================================ */
  .w-text .body {
    padding: 16px 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .w-text .text-display {
    width: 100%; height: 100%;
    margin: 0;
    color: var(--text);
    line-height: 1.45;
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: pre-wrap;
    text-align: center;
    overflow: auto;
    display: flex; align-items: center; justify-content: center;
  }
  .w-text .text-display.font-serif { font-family: var(--font-serif); font-feature-settings: "lnum"; }
  .w-text .text-display.font-sans  { font-family: var(--font-ui); }
  .w-text .text-display.font-mono  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .w-text .text-display.size-sm { font-size: calc(13px * var(--fs-scale)); }
  .w-text .text-display.size-md { font-size: calc(20px * var(--fs-scale)); }
  .w-text .text-display.size-lg { font-size: calc(32px * var(--fs-scale)); }
  .w-text .text-display.align-left   { text-align: left; }
  .w-text .text-display.align-center { text-align: center; }
  .w-text .text-display.align-right  { text-align: right; }
  .w-text .text-display.color-accent { color: var(--accent-2); }
  .w-text .text-display.color-warn   { color: var(--warn); }
  .w-text .text-display.color-good   { color: var(--good); }
  .w-text .text-display.bordered {
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 12px;
  }
  .w-text .text-display.empty {
    color: var(--muted-2);
    font-style: italic;
    font-size: calc(13px * var(--fs-scale));
  }

  /* Settings: text widget textarea + label */
  #settingsBody textarea {
    background: var(--panel-2);
    border: 1px solid var(--border-strong);
    color: var(--text);
    border-radius: var(--r-sm);
    padding: 8px 10px;
    font: inherit;
    font-size: 13px;
    line-height: 1.5;
    outline: none;
    width: 100%;
    resize: vertical;
    min-height: 60px;
  }
  #settingsBody textarea:focus { border-color: var(--accent); }
  #settingsBody .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ============================================================
     News widget — selected cats in body (top), marquee
     ============================================================ */
  .w-news > .w-head .selected-cats,
  .grid-stack-item.w-news .w-news .body .selected-cats {
    display: flex;
    gap: 3px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .w-news > .w-head .selected-cats .scat,
  .grid-stack-item.w-news .w-news .body .selected-cats .scat {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: var(--r-full);
    background: var(--panel-3);
    color: var(--text-2);
    border: 1px solid var(--border-strong);
    letter-spacing: 0.02em;
  }

  /* ============================================================
     GridStack theming — resize handles
     ============================================================ */
  .grid-stack-item-content {
    inset: 0 !important;
    border-radius: var(--r-lg) !important;
    display: flex;
  }
  .grid-stack-item-content > .widget {
    flex: 1;
    height: 100%;
    min-height: 0;
  }
  /* Mount animation: fade in + slide up */
  @keyframes widget-mount-in {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }
  .grid-stack-item.ui-draggable-dragging .widget,
  .grid-stack-item.ui-resizable-resizing .widget { animation: none; }
  .grid-stack > .grid-stack-item:not(.ui-draggable-dragging):not(.ui-resizable-resizing) .widget {
    animation: widget-mount-in 280ms var(--ease-out) both;
  }


  /* ============================================================
     Resize affordance — custom corner indicator + hover glow
     (GridStack v11 handles drag/resize via mouse position; we add
      a visual corner indicator since v11 doesn't render handles)
     ============================================================ */
  .grid-stack-item .resize-corner {
    position: absolute;
    bottom: 0; right: 0;
    width: 16px; height: 16px;
    pointer-events: none;
    cursor: se-resize;
    z-index: 6;
    background:
      linear-gradient(135deg, transparent 50%, var(--muted) 50%);
    opacity: 0;
    transition: opacity var(--t-fast) var(--ease);
  }
  .grid-stack-item:hover .resize-corner { opacity: 0.7; }
  .grid-stack-item .resize-corner:hover { opacity: 1; background: linear-gradient(135deg, transparent 50%, var(--accent) 50%); }

  /* ============================================================
     Modal
     ============================================================ */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(5, 8, 16, 0.65);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    animation: modal-fade-in 200ms var(--ease-out);
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: var(--panel-solid);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-lg);
    padding: 24px;
    min-width: 360px;
    max-width: 90vw;
    max-height: 85vh;
    overflow: auto;
    box-shadow: var(--shadow-lg);
    animation: modal-scale-in 200ms var(--ease-out);
  }
  @keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modal-scale-in { from { opacity: 0; transform: scale(0.96) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .modal h3 { margin: 0 0 16px 0; font-size: calc(15px * var(--fs-scale)); font-weight: 600; letter-spacing: -0.01em; }
  .picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .picker button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--r-md);
    padding: 18px 12px;
    cursor: pointer;
    font: inherit;
    font-weight: 500;
    transition: all var(--t-fast) var(--ease);
  }
  .picker button:hover {
    background: var(--panel-3);
    border-color: var(--border-accent);
    transform: translateY(-1px);
    box-shadow: var(--shadow-accent);
  }
  .picker button:active { transform: translateY(0); }
  .picker .glyph { font-size: calc(28px * var(--fs-scale)); display: block; margin-bottom: 6px; }
  .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label {
    font-size: calc(11px * var(--fs-scale));
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .field input[type=text], .field select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--r-sm);
    padding: 8px 10px;
    font: inherit;
    transition: all var(--t-fast) var(--ease);
  }
  .field input[type=text]:focus, .field select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 5px 12px;
    border-radius: var(--r-full);
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font: inherit;
    font-size: calc(12px * var(--fs-scale));
    font-weight: 500;
    transition: all var(--t-fast) var(--ease);
  }
  .chip:hover { color: var(--text-2); border-color: var(--border-strong); }
  .chip.on {
    background: var(--accent-soft);
    color: var(--accent-2);
    border-color: var(--accent);
  }
  .chip.source-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .chip.source-chip .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .chip.source-chip .badge {
    font-size: calc(9px * var(--fs-scale));
    padding: 1px 5px;
    border-radius: var(--r-sm);
    background: rgba(255,255,255,0.08);
    color: inherit;
    opacity: 0.7;
  }
  .chip.source-chip:not(.on) .dot { opacity: 0.4; }
  .bg-swatches { display: flex; gap: 6px; flex-wrap: wrap; }
  .bg-swatches .swatch {
    width: 28px; height: 28px;
    border-radius: var(--r-full);
    border: 2px solid var(--border);
    background: var(--swatch-color, var(--panel-2));
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: calc(14px * var(--fs-scale));
    transition: all var(--t-fast) var(--ease);
    position: relative;
  }
  .bg-swatches .swatch:hover { transform: scale(1.1); border-color: var(--border-strong); }
  .bg-swatches .swatch.on {
    border-color: var(--text);
    box-shadow: 0 0 0 2px var(--accent-soft);
  }
  .bg-swatches .swatch.on::after {
    content: '✓';
    position: absolute;
    color: white;
    font-size: calc(14px * var(--fs-scale));
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  /* Per-widget font size slider */
  .fs-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    background: var(--panel-2);
    border-radius: var(--r-full);
    border: 1px solid var(--border);
    outline: none;
    margin: 8px 0 4px;
  }
  .fs-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 0 3px var(--accent-soft);
    transition: box-shadow var(--t-fast) var(--ease);
  }
  .fs-slider::-webkit-slider-thumb:hover { box-shadow: 0 0 0 5px var(--accent-soft); }
  .fs-slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .fs-ticks {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted-2);
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }
  .fs-tick {
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 3px;
    transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  }
  .fs-tick:hover { color: var(--text-2); }
  .fs-tick.on {
    color: var(--accent-2);
    background: var(--accent-soft);
  }
  .seg {
    display: inline-flex;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 5px 12px;
    cursor: pointer;
    font: inherit;
    font-size: calc(12px * var(--fs-scale));
    font-weight: 500;
    border-radius: var(--r-sm);
    transition: all var(--t-fast) var(--ease);
  }
  .seg button:hover { color: var(--text-2); }
  .seg button.on {
    background: var(--accent);
    color: white;
    box-shadow: 0 1px 3px var(--accent-glow);
  }

  /* Save button (primary in settings modal) */
  #settingsOk {
    background: var(--accent) !important;
    color: white !important;
    border-color: var(--accent) !important;
  }
  #settingsOk:hover {
    background: var(--accent-2) !important;
    border-color: var(--accent-2) !important;
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  /* ============================================================
     Per-widget compact / hidden actions
     ============================================================ */
  .grid-stack-item.compact .widget > .body { padding: 6px 8px !important; gap: 4px !important; }
  .grid-stack-item.compact .widget > .body > * { margin: 0 !important; }
  .grid-stack-item.actions-hidden .w-actions { display: none !important; }

  /* ============================================================
     Forecast stack layout (vertical)
     ============================================================ */
  .fstack { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .fstack .fday { display: grid; grid-template-columns: 24px 28px 1fr auto; gap: 6px; align-items: center; font-size: calc(12px * var(--fs-scale)); padding: 2px 4px; border-radius: 4px; }
  .fstack .fday:nth-child(odd) { background: var(--panel-2); }
  .fstack .fday-w { color: var(--muted); font-variant-numeric: tabular-nums; }
  .fstack .fday-i { display: flex; align-items: center; }
  .fstack .fday-t { color: var(--text); }
  .fstack .fday-wv { color: var(--accent-2); font-size: calc(11px * var(--fs-scale)); }

  /* Comfort line (compact meta replacement at tiny/narrow) */
  .comfort { font-size: calc(12px * var(--fs-scale)); color: var(--text-2); margin-top: 2px; }

  /* ============================================================
     Settings: danger chips + priority list
     ============================================================ */
  .chip.danger { border-color: rgba(248, 113, 113, 0.4); color: var(--bad); }
  .chip.danger.on { background: rgba(248, 113, 113, 0.18); border-color: var(--bad); }
  .priority-list { display: flex; flex-direction: column; gap: 4px; padding: 6px; background: var(--panel-2); border-radius: var(--r-md); max-height: 240px; overflow-y: auto; }
  .priority-list .chip { justify-content: flex-start; cursor: grab; }
  .priority-list .chip:active { cursor: grabbing; }
  .priority-list .chip .drag-handle { color: var(--muted-2); margin-right: 6px; font-weight: bold; }
  .hint { font-size: calc(11px * var(--fs-scale)); color: var(--muted-2); margin-top: 4px; }

  /* ============================================================
     Empty state
     ============================================================ */
  .empty {
    color: var(--muted);
    text-align: center;
    padding: 80px 24px;
    border: 2px dashed var(--border);
    border-radius: var(--r-lg);
    margin: 24px;
  }
  .empty::before {
    content: '⊞';
    display: block;
    font-size: calc(48px * var(--fs-scale));
    margin-bottom: 12px;
    opacity: 0.4;
  }
</style>
</head>
<body>

<header>
  <div class="brand">⌘ Dashboard</div>
  <div class="tabs" id="tabs"></div>
  <div class="menu" id="fontMenu" style="position:relative;">
    <button class="tool" id="fontBtn" title="字體">字體 ▾</button>
    <div class="menu-list" style="left:auto;right:0;">
      <div class="menu-item" data-font="">系統</div>
      <div class="menu-item" data-font="serif">襯線</div>
      <div class="menu-item" data-font="mono">等寬</div>
    </div>
  </div>
  <div class="menu" id="themeMenu" style="position:relative;">
    <button class="tool" id="themeBtn" title="主題">🎨 ▾</button>
    <div class="menu-list" style="left:auto;right:0;min-width:140px;">
      <div class="menu-item" data-theme="">indigo</div>
      <div class="menu-item" data-theme="emerald">emerald</div>
      <div class="menu-item" data-theme="rose">rose</div>
      <div class="menu-item" data-theme="amber">amber</div>
      <div class="menu-item" data-theme="cyan">cyan</div>
      <div class="menu-item" data-theme="slate">slate</div>
    </div>
  </div>
  <button class="tool" id="modeBtn" title="切換深淺色">🌙</button>
  <div class="menu" id="fsMenu" style="position:relative;">
    <button class="tool" id="fsBtn" title="字體大小">大小 ▾</button>
    <div class="menu-list" style="left:auto;right:0;">
      <div class="menu-item" data-fs="">正常</div>
      <div class="menu-item" data-fs="compact">緊湊</div>
      <div class="menu-item" data-fs="spacious">寬鬆</div>
      <div class="menu-item" data-fs="roomy">特大</div>
    </div>
  </div>
  <button class="tool" id="addWidgetBtn" title="加 widget">+ Widget</button>
  <button class="tool" id="arrangeBtn" title="自動排列（往上收緊）">⊞ 排列</button>
  <div class="menu" id="pageMenu">
    <button class="tool">Page ▾</button>
    <div class="menu-list">
      <div class="menu-item" data-act="add-page">＋ 新增 Page</div>
      <div class="menu-item" data-act="rename-page">✎ 改呢個 Page 名</div>
      <div class="menu-sep"></div>
      <div class="menu-item" data-act="clear-page">🗑 清空呢個 Page</div>
      <div class="menu-item" data-act="delete-page">✕ 刪除呢個 Page</div>
      <div class="menu-sep"></div>
      <div class="menu-item" data-act="reset-all">⚠ 重設全部（清 localStorage）</div>
    </div>
  </div>
</header>

<div class="grid-wrap" id="gridWrap">
  <div class="grid-stack" id="grid"></div>
  <div class="empty" id="empty" style="display:none">呢個 Page 未擺任何 widget。撳「+ Widget」加一個。</div>
</div>

<!-- Add-widget modal -->
<div class="modal-bg" id="picker">
  <div class="modal">
    <h3>加邊種 widget？</h3>
    <div class="picker">
      <button data-type="weather"><span class="glyph">⛅</span>天氣</button>
      <button data-type="clock"><span class="glyph">🕒</span>時鐘</button>
      <button data-type="news"><span class="glyph">📰</span>新聞</button>
      <button data-type="note"><span class="glyph">📝</span>便條</button>
      <button data-type="bus"><span class="glyph">🚌</span>巴士</button>
      <button data-type="text"><span class="glyph">🖋️</span>文字</button>
    </div>
    <div class="actions">
      <button class="tool" id="pickerClose">取消</button>
    </div>
  </div>
</div>

<!-- Per-widget settings modal -->
<div class="modal-bg" id="settings">
  <div class="modal">
    <h3 id="settingsTitle">Widget 設定</h3>
    <div id="settingsBody"></div>
    <div class="actions">
      <button class="tool" id="settingsCancel">取消</button>
      <button class="tool" id="settingsOk" style="background:var(--accent);border-color:var(--accent);color:white;">儲存</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   State
   ============================================================ */
const STORAGE_KEY = "dashproto_v2";
const COLS = 12;
const ROW_HEIGHT = 60; // px

let state = loadState();

function defaultState() {
  return {
    pages: [
      { id: pid(), name: "Home", items: [
        { id: pid(), type: "weather", x: 0, y: 0, w: 5, h: 4, cfg: { place: "香港天文台", showWarn: true } },
        { id: pid(), type: "clock",   x: 5, y: 0, w: 4, h: 4, cfg: { style: "hero", hour24: true, showLunar: true } },
        { id: pid(), type: "news",    x: 9, y: 0, w: 3, h: 6, cfg: { cats: ["local","intl","tech"], lang: "all", autoRefresh: true, marquee: false, marqueeSpeed: "normal" } },
        { id: pid(), type: "note",    x: 0, y: 4, w: 9, h: 3, cfg: { text: "TODO:\n- 寫 prototype\n- 試 drag/resize\n- Page 切換", size: "md" } },
      ]},
      { id: pid(), name: "工作", items: [
        { id: pid(), type: "news", x: 0, y: 0, w: 6, h: 6, cfg: { cats: ["tech","intl"], lang: "en", autoRefresh: true, marquee: true, marqueeSpeed: "normal" } },
        { id: pid(), type: "note", x: 6, y: 0, w: 6, h: 4, cfg: { text: "TODO:\n- 寫 prototype\n- 試 drag/resize", size: "md" } },
      ]},
    ],
    activePage: 0,
    mode: "dark",     // "dark" | "light"
    theme: "",        // "" (default indigo) | "emerald" | "rose" | "amber" | "cyan" | "slate"
    font:  "",        // "" (system) | "serif" | "mono"
    fontSize: "",     // "" (normal) | "compact" | "spacious" | "roomy"
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return defaultState();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}
function pid() { return "x" + Math.random().toString(36).slice(2, 9); }
function currentPage() { return state.pages[state.activePage]; }
function findItem(id) { return currentPage().items.find(x => x.id === id); }

/* ============================================================
   Tabs
   ============================================================ */
const tabsEl = document.getElementById("tabs");
function renderTabs() {
  tabsEl.innerHTML = "";
  state.pages.forEach((p, i) => {
    const el = document.createElement("div");
    el.className = "tab" + (i === state.activePage ? " active" : "");
    el.innerHTML = `<span class="name"></span><span class="x" title="刪除 page">✕</span>`;
    el.querySelector(".name").textContent = p.name;
    el.addEventListener("click", (e) => {
      if (e.target.classList.contains("x")) {
        if (state.pages.length === 1) { alert("最少要一個 page"); return; }
        if (!confirm(`刪除 page「${p.name}」？`)) return;
        state.pages.splice(i, 1);
        if (state.activePage >= state.pages.length) state.activePage = state.pages.length - 1;
        saveState(); renderTabs(); mountPage();
      } else {
        state.activePage = i; saveState(); renderTabs(); mountPage();
      }
    });
    tabsEl.appendChild(el);
  });
}

/* ============================================================
   Page menu
   ============================================================ */
const pageMenuEl = document.getElementById("pageMenu");
pageMenuEl.querySelector("button").addEventListener("click", (e) => {
  e.stopPropagation();
  pageMenuEl.classList.toggle("open");
});
document.addEventListener("click", () => {
  document.getElementById("pageMenu").classList.remove("open");
  document.getElementById("themeMenu").classList.remove("open");
  document.getElementById("fontMenu").classList.remove("open");
});
pageMenuEl.addEventListener("click", (e) => {
  const t = e.target.closest(".menu-item");
  if (!t) return;
  pageMenuEl.classList.remove("open");
  const act = t.dataset.act;
  if (act === "add-page") {
    const name = prompt("新 page 名", "Page " + (state.pages.length + 1));
    if (!name) return;
    state.pages.push({ id: pid(), name, items: [] });
    state.activePage = state.pages.length - 1;
    saveState(); renderTabs(); mountPage();
  } else if (act === "rename-page") {
    const p = currentPage();
    const name = prompt("改 page 名", p.name);
    if (!name) return;
    p.name = name; saveState(); renderTabs();
  } else if (act === "clear-page") {
    if (!confirm("清空呢個 page 所有 widget？")) return;
    currentPage().items = [];
    saveState(); mountPage();
  } else if (act === "delete-page") {
    if (state.pages.length === 1) { alert("最少要一個 page"); return; }
    if (!confirm("刪除呢個 page？")) return;
    state.pages.splice(state.activePage, 1);
    if (state.activePage >= state.pages.length) state.activePage = state.pages.length - 1;
    saveState(); renderTabs(); mountPage();
  } else if (act === "reset-all") {
    if (!confirm("重設全部（包括 localStorage）？")) return;
    localStorage.removeItem(STORAGE_KEY);
    state = defaultState();
    renderTabs(); mountPage();
  }
});

/* ============================================================
   Grid
   ============================================================ */
const gridEl = document.getElementById("grid");
const emptyEl = document.getElementById("empty");
let grid = null;
let suppressChange = false;

function mountPage() {
  suppressChange = true;
  if (grid) { grid.destroy(false); grid = null; }
  gridEl.innerHTML = "";
  const page = currentPage();
  emptyEl.style.display = page.items.length ? "none" : "block";

  grid = GridStack.init({
    column: COLS,
    cellHeight: ROW_HEIGHT,
    margin: 8,
    float: true,
    animate: true,
    disableOneColumnMode: true,
    handle: '.widget',  // entire widget body is the drag handle (no header)
    resizable: { handles: 'se, s, e' },   // SE corner, bottom edge, right edge
    minRow: 1,
    placeholderClass: 'grid-stack-placeholder',
    placeholderText: '',
  }, gridEl);
  // Make the .grid-stack-item itself be relative so the content layer is contained
  gridEl.classList.add('gs-container');
  // Sync gridline CSS variables
  gridEl.style.setProperty('--row-h', ROW_HEIGHT + 'px');
  gridEl.style.setProperty('--margin', '8px');
  // Highlight stronger gridlines during drag/resize
  grid.on('dragstart resizestart', () => gridEl.classList.add('is-snapping'));
  grid.on('dragstop resizestop',  () => gridEl.classList.remove('is-snapping'));

  // Initial gridline render + on resize
  drawGridlines();
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => drawGridlines());
    ro.observe(gridEl);
  } else {
    window.addEventListener('resize', drawGridlines);
  }

  // Update placeholder with current cell coords while dragging/resizing
  function updatePlaceholderCoord() {
    const ph = gridEl.querySelector('.grid-stack-placeholder');
    if (!ph) return;
    const w = parseInt(ph.getAttribute('gs-w') || '0', 10);
    const h = parseInt(ph.getAttribute('gs-h') || '0', 10);
    const x = parseInt(ph.getAttribute('gs-x') || '0', 10);
    const y = parseInt(ph.getAttribute('gs-y') || '0', 10);
    ph.setAttribute('data-coord', `col ${x + 1}–${x + w} · row ${y + 1}–${y + h} · ${w}×${h}`);
  }
  grid.on('change', updatePlaceholderCoord);

  grid.on("change added removed", () => {
    if (suppressChange) return;
    const items = [];
    grid.engine.nodes.forEach(n => {
      const it = n.id ? currentPage().items.find(x => x.id === n.id) : null;
      if (it) {
        it.x = n.x; it.y = n.y; it.w = n.w; it.h = n.h;
        items.push(it);
      }
    });
    if (items.length) {
      currentPage().items = items;
      saveState();
    }
    emptyEl.style.display = currentPage().items.length ? "none" : "block";
    drawGridlines();
  });

  page.items.forEach(it => mountItem(it));
  // Re-enable after microtask so any synchronously-fired change events during init are ignored
  setTimeout(() => { suppressChange = false; }, 0);
}

function mountItem(it, autoPos = false) {
  const el = document.createElement("div");
  el.className = "grid-stack-item " + (it.type ? ("w-" + it.type) : "");
  el.dataset.id = it.id;
  if (it.bg) el.dataset.bg = it.bg;  // per-widget background color theme
  if (it.fs) el.dataset.fs = String(it.fs);  // per-widget font-size scale
  if (it.hidden === true) el.classList.add("actions-hidden");
  if (it.compact === true) el.classList.add("compact");
  const content = document.createElement("div");
  content.className = "grid-stack-item-content";
  const widgetEl = renderWidget(it, el);
  content.appendChild(widgetEl);
  el.appendChild(content);
  gridEl.appendChild(el);
  const limits = widgetLimits(it.type);
  const opts = {
    w: it.w, h: it.h, id: it.id, autoPosition: !!autoPos,
    minW: limits.minW, minH: limits.minH,
    maxW: limits.maxW, maxH: limits.maxH,
  };
  if (!autoPos) { opts.x = it.x; opts.y = it.y; }
  grid.makeWidget(el, opts);
}

/* Per-type size limits. 1×1 minimum (snap to grid). No max — user can grow arbitrarily. */
function widgetLimits(type) {
  switch (type) {
    case "weather": return { minW: 1, minH: 1, maxW: 24, maxH: 24 };
    case "clock":   return { minW: 1, minH: 1, maxW: 24, maxH: 24 };
    case "news":    return { minW: 1, minH: 1, maxW: 24, maxH: 24 };
    case "note":    return { minW: 1, minH: 1, maxW: 24, maxH: 24 };
    case "bus":     return { minW: 2, minH: 2, maxW: 12, maxH: 24 };
    case "text":    return { minW: 1, minH: 1, maxW: 24, maxH: 24 };
    default:        return { minW: 1, minH: 1, maxW: 24, maxH: 24 };
  }
}

/* ============================================================
   Widget rendering
   ============================================================ */
function renderWidget(item, itemEl) {
  const el = document.createElement("div");
  el.className = "widget w-" + item.type;
  el.dataset.id = item.id;
  // Modern borderless design: no header, just a floating action button cluster
  el.innerHTML = `
    <div class="w-actions" data-actions>
      <span class="w-abtn" data-act="settings" title="設定 (右擊 或點此)">⚙</span>
      <span class="w-abtn danger" data-act="remove" title="刪除">✕</span>
    </div>
    <div class="resize-corner" aria-hidden="true"></div>
    <div class="body"></div>`;
  // Stop drag handle when clicking action buttons
  el.querySelectorAll('.w-abtn').forEach(b => b.addEventListener('mousedown', e => e.stopPropagation()));
  el.querySelector('[data-act="settings"]').addEventListener("click", (e) => {
    e.stopPropagation();
    openSettings(item);
  });
  el.querySelector('[data-act="remove"]').addEventListener("click", (e) => {
    e.stopPropagation();
    if (!confirm("刪除呢個 widget？")) return;
    removeWidget(item);
  });
  // Right-click context menu
  el.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    e.stopPropagation();
    showContextMenu(e.clientX, e.clientY, item, el);
  });
  // Inject news-specific selected-cats tags (news only) into the body, top-right area
  if (item.type === "news" && item.cfg.cats && item.cfg.cats.length) {
    const body = el.querySelector(".body");
    if (body) {
      const sc = document.createElement("div");
      sc.className = "selected-cats";
      sc.innerHTML = item.cfg.cats.map(c =>
        `<span class="scat" style="border-color:${CAT_TAG_COLOR[c]||'var(--border-strong)'}40;color:${CAT_TAG_COLOR[c]||'var(--text-2)'}">${CAT_LABEL[c]||c}</span>`
      ).join("");
      body.insertBefore(sc, body.firstChild);
    }
  }
  const body = el.querySelector(".body");
  fillWidgetBody(item, body, el, itemEl);
  return el;
}

/* ============================================================
   Context menu (right-click on widget)
   ============================================================ */
function showContextMenu(x, y, item, el) {
  // Close any existing menu
  document.querySelectorAll(".ctx-menu").forEach(m => m.remove());
  const menu = document.createElement("div");
  menu.className = "ctx-menu";
  // Build per-type items
  const items = [];
  if (item.type === "news") {
    items.push({ icon: "↻", label: "刷新新聞", act: () => refreshWidget(item) });
  }
  items.push({ icon: "⚙", label: "設定", act: () => openSettings(item) });
  if (item.type === "weather" || item.type === "clock" || item.type === "news" || item.type === "note") {
    items.push({ sep: true });
    items.push({ icon: "↕", label: "自動排列所有 widget", act: () => document.getElementById("arrangeBtn").click() });
  }
  items.push({ sep: true });
  items.push({ icon: "⧉", label: "複製 widget", act: () => duplicateWidget(item) });
  items.push({ icon: "✕", label: "刪除 widget", danger: true, act: () => { if (confirm("刪除呢個 widget？")) removeWidget(item); } });
  menu.innerHTML = items.map((it, i) => {
    if (it.sep) return '<div class="ctx-sep"></div>';
    return `<div class="ctx-item ${it.danger?'danger':''}" data-idx="${i}">
      <span class="ctx-icon">${it.icon||''}</span>
      <span>${escapeHtml(it.label)}</span>
    </div>`;
  }).join("");
  // Position with viewport bounds check
  menu.style.left = "0px"; menu.style.top = "0px";
  document.body.appendChild(menu);
  const r = menu.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  menu.style.left = Math.min(x, vw - r.width - 8) + "px";
  menu.style.top  = Math.min(y, vh - r.height - 8) + "px";
  // Wire clicks
  items.forEach((it, i) => {
    if (it.sep) return;
    const node = menu.querySelector(`[data-idx="${i}"]`);
    if (node) node.addEventListener("click", () => { menu.remove(); it.act(); });
  });
  // Close on outside click / escape / scroll
  function close() {
    if (menu.parentNode) menu.remove();
    document.removeEventListener("click", close, true);
    document.removeEventListener("keydown", onKey, true);
  }
  function onKey(e) { if (e.key === "Escape") close(); }
  setTimeout(() => {
    document.addEventListener("click", close, true);
    document.addEventListener("keydown", onKey, true);
  }, 0);
}

function duplicateWidget(item) {
  const p = currentPage();
  const newItem = JSON.parse(JSON.stringify(item));
  newItem.id = pid();
  newItem.x = (item.x || 0) + (item.w || 1) + 1;
  if (newItem.x + newItem.w > 12) newItem.x = 0;
  newItem.y = (item.y || 0) + 1;
  p.items.push(newItem);
  saveState();
  mountItem(newItem, true);
}

function removeWidget(item) {
  const el = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"]`);
  if (el) grid.removeWidget(el);
  // also update state defensively in case the change handler is racy
  currentPage().items = currentPage().items.filter(x => x.id !== item.id);
  saveState();
  emptyEl.style.display = currentPage().items.length ? "none" : "block";
}

function refreshWidget(item) {
  if (item.type === "news") {
    // re-trigger mountNews — find the body and rerun
    const itemEl = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"]`);
    if (itemEl) {
      const body = itemEl.querySelector('.body');
      if (body) {
        body.innerHTML = `<div style="color:var(--muted);padding:16px;">載入中…</div>`;
        // call mountNews logic again by emptying and re-firing
        const fakeEl = document.createElement('div');
        fillWidgetBody(item, body, fakeEl, itemEl);
        fakeEl.remove();
      }
    }
  }
}

function widgetTitle(item) {
  if (item.type === "weather") return "⛅ " + (item.cfg.place || "天氣");
  if (item.type === "clock")   return "🕒 時鐘";
  if (item.type === "news")    return "📰 新聞";
  if (item.type === "note")    return "📝 便條";
  if (item.type === "bus")     return "🚌 " + (item.cfg.stopName || "巴士");
  if (item.type === "text")    return "🖋️ " + (item.cfg.label || "文字");
  return item.type;
}

function fillWidgetBody(item, body, el, itemEl) {
  if (item.type === "weather") return mountWeather(item, body, itemEl);
  if (item.type === "clock")   return mountClock(item, body, itemEl);
  if (item.type === "news")    return mountNews(item, body, itemEl);
  if (item.type === "note")    return mountNote(item, body, itemEl);
  if (item.type === "bus")     return mountBus(item, body, itemEl);
  if (item.type === "text")    return mountText(item, body, itemEl);
}
