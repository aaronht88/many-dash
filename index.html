const HKO_TIMER = new WeakMap();

// Cloudflare Worker proxy (GitHub Pages cannot host Python; routing through many-dash-proxy)
const PROXY_BASE = "https://many-dash-proxy.aaronht88.workers.dev";

async function fetchHKO(dataType = "rhrread", lang = "tc") {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 6000);
  try {
    const r = await fetch(`${PROXY_BASE}/api/hko?dataType=${dataType}&lang=${lang}`, { signal: ctrl.signal });
    if (!r.ok) { console.warn('[HKO] HTTP', r.status, dataType); return null; }
    return await r.json();
  } catch (e) { console.warn('[HKO] fail', dataType, e.message); return null; }
  finally { clearTimeout(t); }
}

// 風速 + 濕度合併一句 "comfort" line（細 widget 用）
function comfortLine(rhr, place) {
  const humid = (findPlaceValue(rhr.humidity, place) || rhr.humidity.data[0]).value;
  const temp  = (findPlaceValue(rhr.temperature, place) || rhr.temperature.data[0]).value;
  let s = "";
  if (humid >= 85) s += "濕焗";
  else if (humid >= 70) s += "有啲翳焗";
  else if (humid >= 50) s += "清爽";
  else s += "乾爽";
  if (temp >= 30) s += " · 熱";
  else if (temp >= 27) s += " · 暖";
  else if (temp >= 22) s += " · 舒適";
  else if (temp >= 18) s += " · 涼";
  else s += " · 凍";
  return s;
}

function findPlaceValue(data, place) {
  if (!data) return null;
  const list = Array.isArray(data) ? data : (data.data || []);
  // exact match first
  let m = list.find(x => x.place === place);
  if (m) return m;
  // partial match (for "香港天文台" / "京士柏" / etc.)
  m = list.find(x => x.place && x.place.includes(place));
  if (m) return m;
  return list[0] || null;
}

function mountWeather(item, body, itemEl) {
  // clear any prior auto-refresh
  const old = HKO_TIMER.get(itemEl);
  if (old) clearInterval(old);

  const place = item.cfg.place || "京士柏";
  const showWarn = item.cfg.showWarn !== false;
  const forecastLayout = item.cfg.forecastLayout || "strip";  // strip | stack | hidden
  // Reflect layout on itemEl so CSS / debugging can read it
  itemEl.dataset.forecastLayout = forecastLayout;

  function renderError(msg, detail) {
    body.innerHTML = `<div style="color:var(--muted);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
      <span>⚠ ${msg}</span>
      ${detail ? `<code style="font-size:10px;color:var(--muted-2);word-break:break-all;">${escapeHtml(detail)}</code>` : ""}
      <button class="tool" data-act="retry" style="font-size:11px;padding:3px 8px;">↻ 重試</button>
    </div>`;
    const retryBtn = body.querySelector('[data-act="retry"]');
    if (retryBtn) retryBtn.addEventListener("click", (e) => { e.stopPropagation(); load(); });
  }

  async function load() {
    if (!body.isConnected) return;
    body.innerHTML = `<div style="color:var(--muted);padding:8px;">載入中…</div>`;
    // DIAGNOSTIC: single raw fetch with full error reporting so we can see
    // exactly what's wrong (CORS, network, HTTP status, JSON parse).
    async function fetchOne(url) {
      try {
        const r = await fetch(url, { mode: "cors", cache: "no-store" });
        if (!r.ok) return { err: `HTTP ${r.status}` };
        const j = await r.json();
        if (!j) return { err: "empty json" };
        return { ok: j };
      } catch (e) { return { err: String(e) }; }
    }
    try {
      const [rhrR, fndR] = await Promise.all([
        fetchOne(`${PROXY_BASE}/api/hko?dataType=rhrread&lang=tc`),
        fetchOne(`${PROXY_BASE}/api/hko?dataType=fnd&lang=tc`),
      ]);
      if (!body.isConnected) return;
      if (rhrR.err) { renderError("HKO 連線失敗", `${PROXY_BASE}/api/hko?dataType=rhrread → ${rhrR.err}`); return; }
      const rhr = rhrR.ok;
      const fnd = fndR.ok || null;  // fnd optional
      console.log("[weather] rhr ok:", !!rhr, "fnd ok:", !!fnd, "icon:", rhr.icon?.[0], "temp:", rhr.temperature?.data?.length);
    const temp   = findPlaceValue(rhr.temperature, place) || rhr.temperature.data[0];
    const humid  = findPlaceValue(rhr.humidity,    place) || rhr.humidity.data[0];
    const uv     = rhr.uvindex && rhr.uvindex.data && rhr.uvindex.data[0];
    const icon   = (rhr.icon && rhr.icon[0]) || 62;
    const iconDef = HKO_ICON[icon] || { e: "🌡️", t: "天氣" };
    // warningMessage may be a string ("") or array of strings depending on HKO data freshness
    const wmRaw = rhr.warningMessage;
    const warn = (Array.isArray(wmRaw) ? wmRaw.join("") : (wmRaw || "")).trim();

    // 7-day forecast (best-effort)
    let days = [];
    if (fnd && fnd.weatherForecast) {
      const wkMap = { "星期日": "日", "星期一": "一", "星期二": "二", "星期三": "三", "星期四": "四", "星期五": "五", "星期六": "六" };
      days = fnd.weatherForecast.slice(0, 7).map((d, i) => {
        const code = parseInt(d.ForecastIcon, 10);
        const def = HKO_ICON[code] || { e: "🌡️", svg: "" };
        const min = parseInt(d.forecastMintemp.value, 10);
        const max = parseInt(d.forecastMaxtemp.value, 10);
        // 海浪 (sea state) icon: HKO fnd includes forecastWind + forecastWeatherDesc,
        // we infer 浪 from 風速（海面狀態通常跟大風掛勾）。
        const windDesc = (d.forecastWind || "") + (d.forecastWeatherDesc || "");
        let wave = "平"; let waveIcon = "🌊";
        if (/大風|烈風|暴風|強風|颱風|9級|10級|11級/.test(windDesc)) { wave = "巨浪"; waveIcon = "🌊🌊"; }
        else if (/清勁|清風|疾勁|強風|6級|7級|8級/.test(windDesc)) { wave = "大浪"; waveIcon = "🌊"; }
        else if (/微風|和緩|清風|3級|4級|5級/.test(windDesc)) { wave = "中浪"; waveIcon = "〰️"; }
        else { wave = "小浪"; waveIcon = "≈"; }
        return { day: wkMap[d.week] || "?", e: def.e, svg: def.svg, t: def.t, max, min, code, wave, waveIcon };
      });
    }
    if (days.length === 0) {
      // fallback: render placeholder
      days = Array.from({length: 7}, (_, i) => ({ day: ["一","二","三","四","五","六","日"][i], e: "🌡️", max: "--", min: "--", code: 0, wave: "平", waveIcon: "🌊" }));
    }

    // Forecast rendering based on user-selected layout
    const forecastHtml = forecastLayout === "hidden" ? "" : (
      forecastLayout === "stack" ? `
        <div class="fstack">
          ${days.map(d => `
            <div class="fday" title="${escapeHtml(d.t)}">
              <span class="fday-w">${d.day}</span>
              <span class="fday-i">${d.svg}</span>
              <span class="fday-t"><b>${d.max}°</b> / ${d.min}°</span>
              <span class="fday-wv" title="海況：${d.wave}">${d.waveIcon}</span>
            </div>
          `).join("")}
        </div>
      ` : `
        <div class="strip">
          ${days.map(d => `
            <div class="day" title="${escapeHtml(d.t)} · 海況：${d.wave}">
              <span>${d.day}</span>
              <div class="d-icon">${d.svg}</div>
              <b>${d.max}°</b>
              <div class="bar" style="width:${30 + (d.max - 25) * 5}%"></div>
            </div>
          `).join("")}
        </div>
      `
    );

    // 風速/濕度 collapsed into a single "comfort" sentence at tiny/narrow sizes
    const size = itemEl.dataset.size || "normal";
    const compactMeta = ["tiny","narrow"].includes(size);

    body.innerHTML = `
      <div class="wx-top">
        <div class="wx-icon">${iconDef.svg}</div>
        <div class="wx-temp">${temp.value}°</div>
      </div>
      <div class="cond">${escapeHtml(iconDef.t)} · ${escapeHtml(place)}</div>
      ${warn && showWarn ? `<div class="w-warn">${escapeHtml(warn)}</div>` : ""}
      ${compactMeta ? `
        <div class="comfort">${comfortLine(rhr, place)}</div>
      ` : `
        <div class="meta">
          <span>體感 <b>${temp.value}°</b></span>
          <span>濕度 <b>${humid.value}%</b></span>
          ${uv ? `<span>UV <b>${uv.value} ${escapeHtml(uv.desc || '')}</b></span>` : ""}
        </div>
      `}
      ${forecastHtml}
      <div class="updated">更新於 ${new Date(rhr.updateTime).toLocaleTimeString("zh-HK", {hour:"2-digit", minute:"2-digit"})}</div>
    `;
    }
    catch (e) {
      console.error("weather load failed:", e);
      if (body.isConnected) renderError("天氣 widget 載入失敗", String(e && e.message || e));
    }
  }
  // Robust defer: poll for body connection every 32ms up to 5s, then load.
  // mountItem calls renderWidget BEFORE appending to gridEl, so body.isConnected
  // is false on first call. GridStack's attach is sync but its layout pass happens
  // on the next animation frame, so we just poll until attached.
  let tries = 0;
  const tryLoad = () => {
    if (body.isConnected) { load(); return; }
    if (tries++ > 150) { renderError("HKO: widget 載入失敗"); return; } // 5s timeout
    setTimeout(tryLoad, 32);
  };
  tryLoad();
  // auto-refresh every 10 min (HKO updates roughly every 10-30 min)
  // WeakMap needs live DOM nodes, so defer until itemEl is attached
  const startRefresh = () => {
    if (!itemEl.isConnected) return;
    const old = HKO_TIMER.get(itemEl);
    if (old) clearInterval(old);
    const t = setInterval(load, 10 * 60 * 1000);
    HKO_TIMER.set(itemEl, t);
    const mo = new MutationObserver(() => {
      if (!document.body.contains(itemEl)) { clearInterval(t); mo.disconnect(); }
    });
    mo.observe(document.body, { childList: true, subtree: true });
  };
  if (itemEl.isConnected) startRefresh();
  else setTimeout(startRefresh, 0);
}

/* --- Text (decorative, custom content) --- */
function mountText(item, body, itemEl) {
  const text = item.cfg.text || "";
  const font = item.cfg.font || "sans";   // sans | serif | mono
  const size = item.cfg.size || "md";    // sm | md | lg
  const align = item.cfg.align || "center";  // left | center | right
  const bordered = item.cfg.bordered === true;
  const color = item.cfg.color || "";     // "" | accent | warn | good
  const classes = ["text-display", `font-${font}`, `size-${size}`, `align-${align}`];
  if (bordered) classes.push("bordered");
  if (color) classes.push(`color-${color}`);
  if (!text) classes.push("empty");
  body.innerHTML = `<div class="${classes.join(' ')}">${escapeHtml(text) || "未輸入文字 — 右擊 widget → 設定"}</div>`;
}

/* --- Bus (KMB ETA list) --- */
const busTimers = new WeakMap();
function mountBus(item, body, itemEl) {
  // clear any prior timer
  const old = busTimers.get(itemEl);
  if (old) { clearInterval(old.t); old.mo.disconnect(); }

  const stopId = item.cfg.stopId;
  if (!stopId) {
    // Pick-a-stop placeholder
    body.innerHTML = `
      <div class="bus-pick-stop">
        <div class="glyph">🚌</div>
        <div>未揀巴士站</div>
        <div class="hint">右擊 widget → 設定，揀 KMB 巴士站</div>
      </div>`;
    return;
  }
  const stopName = item.cfg.stopName || stopId;
  const filterRoutes = item.cfg.routes || null;  // null = all

  // Module-level state for stale-while-revalidate
  let lastSuccessAt = 0;     // ms timestamp of last successful fetch
  let lastFetchMs = 0;       // duration of last fetch (for debug)
  let lastSuccessSnapshot = null;  // { stopName, generated, enriched, listHtml } — last good render payload
  let fetchInFlight = false;
  let intervalMs = 60 * 1000;  // 60s instead of 30s — KMB data refreshes ~30s but 60s halves flicker

  function fmtAge(ms) {
    if (ms < 0) return "";
    if (ms < 60_000) return Math.floor(ms / 1000) + "s 前";
    return Math.floor(ms / 60_000) + " 分鐘前";
  }

  function paintStatus(statusClass, statusText) {
    const el = body.querySelector(".bus-status");
    if (!el) return;
    el.className = "bus-status " + (statusClass || "");
    el.textContent = statusText;
  }

  // Render full bus list to body. Keeps the same top wrapper so we can paint a status line in place.
  function renderList(payload) {
    const { enriched, generated, listHtml } = payload;
    lastSuccessSnapshot = payload;
    lastSuccessAt = Date.now();
    body.innerHTML = `
      <div class="bus-stop-name">${escapeHtml(stopName)}<span class="stop-no">${stopId.slice(0, 8)}…</span></div>
      <div class="bus-meta">
        <span>KMB · ${enriched.length} 班次 · ${new Date(generated || Date.now()).toLocaleTimeString("zh-HK", {hour:"2-digit", minute:"2-digit"})}</span>
        <span class="bus-status"></span>
      </div>
      <div class="bus-list">${listHtml}</div>
    `;
    // First paint: status = "✓ 剛剛" (good)
    paintStatus("ok", "↻ " + fmtAge(0));
  }

  function renderEmpty(payload) {
    lastSuccessSnapshot = null;
    lastSuccessAt = 0;
    body.innerHTML = `
      <div class="bus-stop-name">${escapeHtml(stopName)}<span class="stop-no">${stopId.slice(0, 8)}…</span></div>
      <div class="bus-meta">
        <span>未來 30 分鐘冇班次</span>
        <span class="bus-status"></span>
      </div>
    `;
    paintStatus("ok", "");
  }

  function renderError(msg, detail) {
    // Stale-while-revalidate: if we have a previous snapshot, keep showing it + overlay error hint.
    if (lastSuccessSnapshot) {
      // Don't replace body — just update the status line with the error.
      const ageMs = Date.now() - lastSuccessAt;
      paintStatus("err", `⚠ 更新失敗 · keep 顯示 ${fmtAge(ageMs)} 嘅舊 data`);
      console.warn(`[bus] update failed, keeping stale data (${fmtAge(ageMs)} old):`, msg, detail || "");
      return;
    }
    // No prior data → show full error UI
    body.innerHTML = `<div style="color:var(--muted);padding:8px;display:flex;flex-direction:column;gap:6px;">
      <span>⚠ ${msg}</span>
      ${detail ? `<code style="font-size:10px;color:var(--muted-2);word-break:break-all;">${escapeHtml(detail)}</code>` : ""}
      <button class="tool" data-act="retry" style="font-size:11px;padding:3px 8px;">↻ 重試</button>
    </div>`;
    const retryBtn = body.querySelector('[data-act="retry"]');
    if (retryBtn) retryBtn.addEventListener("click", (e) => { e.stopPropagation(); load(); });
  }

  async function load() {
    if (!body.isConnected) return;
    if (fetchInFlight) return;  // skip overlapping fetches
    fetchInFlight = true;
    const t0 = performance.now();
    try {
      const r = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`, { cache: "no-store" });
      const fetchMs = performance.now() - t0;
      lastFetchMs = fetchMs;
      console.log(`[bus] fetch ${stopId} took ${fetchMs.toFixed(0)}ms`);
      if (!body.isConnected) return;
      if (!r.ok) { renderError("KMB 連線失敗", `HTTP ${r.status}`); return; }
      const j = await r.json();
      if (!body.isConnected) return;
      const raw = (j && j.data) || [];
      // Filter by routes if user selected specific routes
      let data = raw;
      if (Array.isArray(filterRoutes) && filterRoutes.length > 0) {
        data = data.filter(d => filterRoutes.includes(String(d.route)));
      }
      // Compute ETA minutes + sort by eta asc; keep top 12
      const now = Date.now();
      const enriched = data.map(d => {
        const t = d.eta ? new Date(d.eta).getTime() : null;
        const min = t ? Math.round((t - now) / 60000) : null;
        return { ...d, _min: min };
      }).filter(d => d._min !== null)
        .sort((a, b) => a._min - b._min)
        .slice(0, 12);
      if (enriched.length === 0) {
        renderEmpty({ generated: j.generated_timestamp, enriched: [], listHtml: "" });
        return;
      }
      const listHtml = enriched.map(d => {
        let etaText, etaClass = "";
        if (d._min <= 0) { etaText = "即將"; etaClass = "eta-now"; }
        else if (d._min === 1) { etaText = "1 分鐘"; etaClass = "eta-now"; }
        else if (d._min <= 5) { etaText = d._min + " 分鐘"; etaClass = "eta-soon"; }
        else if (d._min < 60) { etaText = d._min + " 分鐘"; }
        else { etaText = Math.floor(d._min / 60) + "h" + (d._min % 60) + "m"; }
        return `
          <div class="bus-row">
            <span class="bus-route">${escapeHtml(String(d.route))}</span>
            <span class="bus-dest" title="${escapeHtml(d.dest_tc || '')}">${escapeHtml(d.dest_tc || '—')}</span>
            <span class="bus-eta ${etaClass}">${etaText}</span>
          </div>
        `;
      }).join("");
      renderList({ enriched, generated: j.generated_timestamp, listHtml });
    } catch (e) {
      console.error("[bus] load failed:", e);
      if (body.isConnected) renderError("巴士 widget 載入失敗", String(e && e.message || e));
    } finally {
      fetchInFlight = false;
    }
  }

  // Status updater — paints the age line every 5s without re-fetching
  function refreshStatus() {
    if (!body.isConnected) return;
    if (!lastSuccessSnapshot) return;
    const ageMs = Date.now() - lastSuccessAt;
    if (lastFetchMs > 3000) {
      paintStatus("warn", `↻ ${fmtAge(ageMs)} · fetch ${lastFetchMs.toFixed(0)}ms (慢)`);
    } else {
      paintStatus("ok", `↻ ${fmtAge(ageMs)}`);
    }
  }

  // Initial paint: loader
  body.innerHTML = `<div style="color:var(--muted);padding:8px;">載入中…</div>`;
  // Auto-refresh: fetch + status refresh
  const t = setInterval(load, intervalMs);
  const ts = setInterval(refreshStatus, 5 * 1000);
  const mo = new MutationObserver(() => {
    if (!document.body.contains(itemEl)) { clearInterval(t); clearInterval(ts); mo.disconnect(); }
  });
  busTimers.set(itemEl, { t, ts, mo });
  mo.observe(document.body, { childList: true, subtree: true });
  load();
}

/* --- Clock (live) --- */
const clockTimers = new WeakMap();
function mountClock(item, body, itemEl) {
  // clear any prior timer on same el
  const old = clockTimers.get(itemEl);
  if (old) { clearInterval(old.t); old.mo.disconnect(); }
  const style = item.cfg.style || "hero";
  const hour24 = item.cfg.hour24 !== false;
  const showLunar = item.cfg.showLunar !== false;
  // apply style classes on the grid-stack-item so CSS can target them
  itemEl.classList.remove("style-hero","style-compact","style-minimal");
  itemEl.classList.add("style-" + style);
  body.innerHTML = `
    <div class="time">--:--:--</div>
    <div class="date" ${style === "minimal" ? "style='display:none'" : ""}></div>
    <div class="lunar" ${showLunar ? "" : "style='display:none'"}>農曆 丙午年 六月</div>
  `;
  const tick = () => {
    const n = new Date();
    const pad = x => String(x).padStart(2,"0");
    let h = n.getHours();
    let suffix = "";
    if (!hour24) {
      suffix = h >= 12 ? " PM" : " AM";
      h = h % 12 || 12;
    }
    // Responsive: tiny → HH:MM; narrow+ → HH:MM:SS; wide/xlarge always show seconds
    const size = itemEl.dataset.size || "normal";
    const showSec = !["tiny","narrow"].includes(size);
    const timeStr = showSec
      ? `${pad(h)}:${pad(n.getMinutes())}:${pad(n.getSeconds())}${suffix}`
      : `${pad(h)}:${pad(n.getMinutes())}${suffix}`;
    body.querySelector(".time").textContent = timeStr;
    const wk = ["日","一","二","三","四","五","六"][n.getDay()];
    const dEl = body.querySelector(".date");
    if (dEl && dEl.style.display !== "none") {
      dEl.textContent = `${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${wk}`;
    }
  };
  tick();
  const t = setInterval(tick, 1000);
  clockTimers.set(itemEl, t);
  const mo = new MutationObserver(() => { if (!document.body.contains(itemEl)) { clearInterval(t); mo.disconnect(); } });
  mo.observe(document.body, { childList: true, subtree: true });
  // Re-render time when widget size attribute changes (responsive)
  const sizeMo = new MutationObserver(() => tick());
  sizeMo.observe(itemEl, { attributes: true, attributeFilter: ["data-size"] });
}

const FETCH_TIMEOUT_MS = 10000;
async function fetchFeed(url) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try {
    const r = await fetch(`${PROXY_BASE}/api/feed?url=${encodeURIComponent(url)}`, { signal: ctrl.signal });
    if (!r.ok) return null;
    const d = await r.json();
    return d.items || [];
  } catch (e) { return null; }
  finally { clearTimeout(t); }
}

function activeSourcesFor(cat, enabled) {
  if (enabled && Array.isArray(enabled)) {
    return enabled.map(id => SOURCES[id]).filter(s => s && s.cat === cat);
  }
  return (DEFAULT_SOURCES[cat] || []).map(id => SOURCES[id]).filter(Boolean);
}

async function loadNewsForCfg(cfg) {
  const cats = (cfg.cats && cfg.cats.length) ? cfg.cats : ["local","intl","tech"];
  const excludedCats = cfg.excludedCats || [];
  const activeCats = cats.filter(c => !excludedCats.includes(c));
  const lang = cfg.lang || "all";
  const enabled = cfg.enabledSources || null;
  const sortBy = cfg.sortBy || "time";   // time | source | cat
  const sourcePriority = cfg.sourcePriority || null;
  const all = [];
  const seen = new Set();
  for (const c of activeCats) {
    const sources = activeSourcesFor(c, enabled).filter(s => lang === "all" || s.lang === lang);
    if (!sources.length) {
      // try fake fallback (also honor lang)
      const fakes = FAKE_NEWS.filter(n => n.cat === c && (lang === "all" || n.lang === lang));
      fakes.forEach(n => { if (!seen.has(n.t || n.title)) { seen.add(n.t || n.title); all.push({
        title: n.t, link: n.link, ts: n.ts,
        cat: c, lang: n.lang, srcId: "fake_" + c, srcLabel: n.srcLabel, color: CAT_TAG_COLOR[c] || "#888",
      }); } });
      continue;
    }
    const sourcesWithIds = sources.map(s => {
      const id = Object.keys(SOURCES).find(k => SOURCES[k] === s);
      return { ...s, id };
    });
    const results = await Promise.all(sourcesWithIds.map(s => fetchFeed(s.url).then(items => items ? items.map(it => ({
      title: it.title, link: it.link, ts: it.ts,
      cat: c, lang: s.lang, srcId: s.id, srcLabel: s.label, color: s.color,
    })) : null)));
    results.forEach(items => {
      if (!items) return;
      items.forEach(n => {
        if (!seen.has(n.title)) { seen.add(n.title); all.push(n); }
      });
    });
  }
  // Round-robin across sources: take 1 newest from each source, then repeat, until each source exhausted.
  // This guarantees a balanced mix even if one source is much fresher.
  const bySource = new Map();
  all.forEach(n => {
    if (!bySource.has(n.srcId)) bySource.set(n.srcId, []);
    bySource.get(n.srcId).push(n);
  });
  // Sort each source's items newest-first
  bySource.forEach(arr => arr.sort((a, b) => {
    const ta = parseTs(a.ts), tb = parseTs(b.ts);
    if (ta === Number.MAX_SAFE_INTEGER) return 1;
    if (tb === Number.MAX_SAFE_INTEGER) return -1;
    return ta - tb;
  }));
  // Round-robin pick
  const balanced = [];
  const sourceLists = [...bySource.values()];
  let added = true;
  while (added) {
    added = false;
    for (const arr of sourceLists) {
      if (arr.length) { balanced.push(arr.shift()); added = true; }
    }
  }
  // Final sort based on user preference. "time" keeps round-robin (newest first inside each source).
  // "source" / "cat" group by priority (sourcePriority overrides SOURCES insertion order).
  if (sortBy === "source" || sortBy === "cat") {
    const priorityOrder = sourcePriority && sourcePriority.length
      ? sourcePriority
      : Object.keys(SOURCES);
    const orderMap = new Map(priorityOrder.map((id, i) => [id, i]));
    balanced.sort((a, b) => {
      if (sortBy === "cat") {
        if (a.cat !== b.cat) return (a.cat || "").localeCompare(b.cat || "");
      }
      const oa = orderMap.has(a.srcId) ? orderMap.get(a.srcId) : 9999;
      const ob = orderMap.has(b.srcId) ? orderMap.get(b.srcId) : 9999;
      if (oa !== ob) return oa - ob;
      // tiebreaker: keep time order
      const ta = parseTs(a.ts), tb = parseTs(b.ts);
      if (ta === Number.MAX_SAFE_INTEGER) return 1;
      if (tb === Number.MAX_SAFE_INTEGER) return -1;
      return ta - tb;
    });
  }
  return balanced;
}
function parseTs(ts) {
  if (!ts) return Number.MAX_SAFE_INTEGER;
  // Relative format: "10 分鐘前" / "3 小時前" / "2 日前"
  const m = String(ts).match(/^(\d+)\s*(秒|分鐘|小時|日)/);
  if (m) {
    const n = parseInt(m[1], 10);
    const unit = m[2];
    return unit === "秒" ? n : unit === "分鐘" ? n*60 : unit === "小時" ? n*3600 : n*86400;
  }
  // ISO 8601 / RFC 2822: try Date.parse
  const d = Date.parse(ts);
  if (!isNaN(d)) {
    return Math.max(0, Math.floor((Date.now() - d) / 1000));
  }
  return Number.MAX_SAFE_INTEGER;
}

// Per-widget refresh timers
const newsTimers = new WeakMap();
function mountNews(item, body, itemEl) {
  // Item may not be attached yet. Defer initial load until body is in the DOM.
  let firstLoadStarted = false;
  function load() {
    if (!body.isConnected) return; // body removed mid-flight
    firstLoadStarted = true;
    const marqueeOn = item.cfg.marquee === true;
    // Map speed setting to animation duration (slower = bigger number)
    const speedMap = { slow: 120, normal: 60, fast: 30 };
    const duration = speedMap[item.cfg.marqueeSpeed || 'normal'] || 60;
    body.innerHTML = `<div class="news-list${marqueeOn ? ' marquee-mode' : ''}" style="${marqueeOn ? `--marquee-duration:${duration}s;` : ''}"><div style="color:var(--muted);padding:16px;">載入中…</div></div>`;
    loadNewsForCfg(item.cfg).then(items => {
      if (!body.isConnected) return;
      if (!items.length) {
        body.innerHTML = `<div class="news-list"><div style="color:var(--muted);padding:16px;">冇新聞</div></div>`;
        return;
      }
      const visible = items.slice(0, 50);
      const listHTML = visible.map(n => `
        <a class="item" href="${escapeAttr(n.link || '#')}" target="_blank" rel="noopener">
          <span class="tags">
            <span class="src" style="background:${escapeAttr(n.color || '#4f8bff')}">${escapeHtml(n.srcLabel || '')}</span>
            <span class="cat-tag" style="background:${escapeAttr(CAT_TAG_COLOR[n.cat] || '#4f8bff')}">${escapeHtml(CAT_LABEL[n.cat] || n.cat || '')}</span>
            <span class="lang-tag lang-${escapeAttr(n.lang || '')}">${escapeHtml(LANG_LABEL[n.lang] || n.lang || '')}</span>
          </span>
          <span class="title-line">${escapeHtml(n.title || n.t || '')}</span>
          <span class="ts">· ${escapeHtml(n.ts || '')}</span>
        </a>
      `).join("");
      // When marquee is on, wrap duplicated list in a single inner div for transform animation
      let innerHTML;
      if (marqueeOn) {
        innerHTML = `<div class="inner-track">${listHTML}${listHTML}</div>`;
      } else {
        innerHTML = listHTML;
      }
      body.innerHTML = `<div class="news-list${marqueeOn ? ' marquee-mode' : ''}" style="${marqueeOn ? `--marquee-duration:${duration}s;` : ''}">${innerHTML}</div>`;
    });
  }
  // Wait for body to be in DOM, then load. Uses rAF for the not-yet-attached case.
  const tryLoad = () => { if (body.isConnected && !firstLoadStarted) load(); };
  if (body.isConnected) load();
  else requestAnimationFrame(tryLoad);
  // Auto-refresh every 5 min (only after itemEl is attached, WeakMap needs live nodes)
  if (item.cfg.autoRefresh !== false) {
    const startInterval = () => {
      if (!itemEl.isConnected) return;
      const old = newsTimers.get(itemEl);
      if (old) clearInterval(old);
      const t = setInterval(load, 5 * 60 * 1000);
      newsTimers.set(itemEl, t);
      const mo = new MutationObserver(() => {
        if (!document.body.contains(itemEl)) { clearInterval(t); mo.disconnect(); }
      });
      mo.observe(document.body, { childList: true, subtree: true });
    };
    if (itemEl.isConnected) startInterval();
    else requestAnimationFrame(startInterval);
  }
}

function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s) { return escapeHtml(s); }

          <div class="results" id="f-bus-results">
            <div class="loading">點上面輸入 → 撳「搜全部」→ 從結果揀一個站</div>
          </div>
          <button class="tool" id="f-bus-search-all" style="font-size:11px;padding:4px 10px;">搜全部</button>

          <span style="font-family:var(--font-mono);font-size:10px;color:var(--muted-2);margin-left:6px;" id="f-bus-current-id">${stopId ? stopId : ""}</span>

      <div class="field">

        </div>
        <div class="hint" style="color:var(--muted-2);">點 chip 切換揀選 / 取消揀選</div>
      </div>
    `;
  }
  if (item.type === "text") {
    const text = item.cfg.text || "";
    const font = item.cfg.font || "sans";
    const size = item.cfg.size || "md";
    const align = item.cfg.align || "center";

    return `
      ${bgField}
      ${fsField}
      ${commonFields}
      <div class="field">
        <label>文字內容</label>
        <textarea id="f-text" rows="4" placeholder="輸入你想顯示嘅文字…支援換行。&#10;例：「Stay hungry, stay foolish」&#10;或 1 段 motto / quote">${escapeHtml(text)}</textarea>
      </div>
      <div class="field">
        <label>字體</label>
        <div class="seg" id="f-text-font">
          <button data-v="sans"  class="${font==='sans' ?'on':''}">Sans</button>
          <button data-v="serif" class="${font==='serif'?'on':''}">Serif</button>
          <button data-v="mono"  class="${font==='mono' ?'on':''}">Mono</button>
        </div>
      </div>
      <div class="field">
        <label>大小</label>
        <div class="seg" id="f-text-size">
          <button data-v="sm" class="${size==='sm'?'on':''}">細</button>
          <button data-v="md" class="${(!item.cfg.size||size==='md')?'on':''}">中</button>
          <button data-v="lg" class="${size==='lg'?'on':''}">大</button>
        </div>
      </div>
      <div class="field">
        <label>對齊</label>
        <div class="seg" id="f-text-align">
          <button data-v="left"   class="${align==='left'  ?'on':''}">左</button>
          <button data-v="center" class="${(!item.cfg.align||align==='center')?'on':''}">中</button>
          <button data-v="right"  class="${align==='right' ?'on':''}">右</button>
        </div>
      </div>
      <div class="field">
        <label>顏色</label>
        <div class="seg" id="f-text-color">
          <button data-v=""       class="${color===''      ?'on':''}">預設</button>
          <button data-v="accent" class="${color==='accent'?'on':''}">Accent</button>
          <button data-v="warn"   class="${color==='warn'  ?'on':''}">Warn</button>
          <button data-v="good"   class="${color==='good'  ?'on':''}">Good</button>
        </div>
      </div>
      <div class="field">
        <label>邊框</label>
        <div class="seg" id="f-text-bordered">
          <button data-v="false" class="${!bordered?'on':''}">關</button>
          <button data-v="true"  class="${bordered?'on':''}">開</button>
        </div>
      </div>
    `;
  }
  return "";
}

function bindSettingsForm(item) {
  // weather: select change
  const placeSel = document.getElementById("f-place");
  if (placeSel) placeSel.addEventListener("change", () => {
    item.cfg.place = placeSel.value;
    saveState();
    // update title live
    const el = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"] .title`);
    if (el) el.textContent = widgetTitle(item);
    // re-mount weather to load new place
    const itemEl = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"]`);
    if (itemEl) {
      const body = itemEl.querySelector(".body");
      if (body) {
        body.innerHTML = `<div style="color:var(--muted);padding:8px;">載入中…</div>`;
        const fakeEl = document.createElement('div');
        fillWidgetBody(item, body, fakeEl, itemEl);
        fakeEl.remove();
      }
    }
  });
  // text widget: textarea live update (debounced)
  const textInput = document.getElementById("f-text");
  if (textInput) {
    let tTimer = null;
    textInput.addEventListener("input", () => {
      clearTimeout(tTimer);
      tTimer = setTimeout(() => {
        item.cfg.text = textInput.value;
        saveState();
        // live update widget body (no remount — just swap content)
        const itemEl = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"]`);
        if (itemEl) {
          const body = itemEl.querySelector(".body");
          if (body) {
            const fakeEl = document.createElement('div');
            fillWidgetBody(item, body, fakeEl, itemEl);
            fakeEl.remove();
          }
        }
      }, 200);
    });
  }
  // segmented (boolean / enum)
  settingsBody.querySelectorAll(".seg").forEach(seg => {
    seg.addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const valRaw = btn.dataset.v;
      const val = valRaw === "true" ? true : valRaw === "false" ? false : valRaw;
      const id = seg.id;
      // visual
      seg.querySelectorAll("button").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      // save
      if (id === "f-showWarn") item.cfg.showWarn = val;
      if (id === "f-style")     item.cfg.style = val;
      if (id === "f-hour24")    item.cfg.hour24 = val;
      if (id === "f-showLunar") item.cfg.showLunar = val;
      if (id === "f-size")      item.cfg.size = val;
      if (id === "f-lang")      item.cfg.lang = val;
      if (id === "f-autoRefresh") item.cfg.autoRefresh = val;
      if (id === "f-marquee")   item.cfg.marquee = val;
      if (id === "f-marqueeSpeed") item.cfg.marqueeSpeed = val;
      if (id === "f-forecastLayout") item.cfg.forecastLayout = val;
      if (id === "f-sortBy")    item.cfg.sortBy = val;
      if (id === "f-text-font")  item.cfg.font = val;
      if (id === "f-text-size")  item.cfg.size = val;
      if (id === "f-text-align") item.cfg.align = val;
      if (id === "f-text-color") item.cfg.color = val;
      if (id === "f-text-bordered") item.cfg.bordered = val;
      if (id === "f-hidden") {
        item.hidden = val;
        const itemEl = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"]`);
        if (itemEl) {
          if (val) itemEl.classList.add("actions-hidden");
          else itemEl.classList.remove("actions-hidden");
        }
      }
      if (id === "f-compact") {
        item.compact = val;
        const itemEl = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"]`);
        if (itemEl) {
          if (val) itemEl.classList.add("compact");
          else itemEl.classList.remove("compact");
        }
        saveState();
        return;  // skip mountPage, no need to rebuild DOM
      }
      saveState();
      // remount so visual updates immediately
      mountPage();
    });
  });
  // Excluded cats (blacklist chips, danger style)
  const excCatsBox = document.getElementById("f-excludedCats");
  if (excCatsBox) {
    excCatsBox.addEventListener("click", e => {
      const c = e.target.closest(".chip");
      if (!c) return;
      const v = c.dataset.v;
      let exc = (item.cfg.excludedCats || []).slice();
      if (exc.includes(v)) exc = exc.filter(x => x !== v);
      else exc.push(v);
      item.cfg.excludedCats = exc;
      c.classList.toggle("on");
      saveState();
      mountPage();
    });
  }
  // Source priority drag-to-reorder
  const priBox = document.getElementById("f-priority");
  if (priBox) {
    let dragId = null;
    priBox.querySelectorAll(".chip.draggable").forEach(chip => {
      chip.addEventListener("dragstart", e => {
        dragId = chip.dataset.v;
        e.dataTransfer.effectAllowed = "move";
        chip.style.opacity = "0.4";
      });
      chip.addEventListener("dragend", () => { chip.style.opacity = ""; dragId = null; });
      chip.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "move"; });
      chip.addEventListener("drop", e => {
        e.preventDefault();
        if (!dragId || dragId === chip.dataset.v) return;
        const order = Array.from(priBox.querySelectorAll(".chip")).map(c => c.dataset.v);
        const from = order.indexOf(dragId);
        const to = order.indexOf(chip.dataset.v);
        if (from < 0 || to < 0) return;
        order.splice(to, 0, order.splice(from, 1)[0]);
        // re-render
        const frag = document.createDocumentFragment();
        order.forEach(id => {
          const c = priBox.querySelector(`.chip[data-v="${id}"]`);
          if (c) frag.appendChild(c);
        });
        priBox.appendChild(frag);
        item.cfg.sourcePriority = order;
        saveState();
      });
    });
  }
  // multi-select chips
  const catsBox = document.getElementById("f-cats");
  if (catsBox) {
    catsBox.addEventListener("click", e => {
      const c = e.target.closest(".chip");
      if (!c) return;
      const v = c.dataset.v;
      let cats = (item.cfg.cats || []).slice();
      if (cats.includes(v)) cats = cats.filter(x => x !== v);
      else cats.push(v);
      item.cfg.cats = cats;
      c.classList.toggle("on");
      saveState();
      mountPage();
    });
  }
  // news source chips: state is "all on" (default) or explicit enabled[].
  // To keep UX simple, "all on" = item.cfg.enabledSources === null.
  // Clicking a chip toggles it. If after toggle it's a no-op (all on or all off in cat), we set null.
  const bgBox = document.getElementById("f-bg");
  if (bgBox) {
    bgBox.addEventListener("click", e => {
      const s = e.target.closest(".swatch");
      if (!s) return;
      const v = s.dataset.v || "";
      item.bg = v || undefined;
      // visual toggle
      bgBox.querySelectorAll(".swatch").forEach(x => x.classList.remove("on"));
      s.classList.add("on");
      // apply live to the item element
      const itemEl = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"]`);
      if (itemEl) {
        if (v) itemEl.dataset.bg = v;
        else delete itemEl.dataset.bg;
      }
      saveState();
    });
  }

  // Font size slider + tick clicks
  const fsSlider = document.getElementById("f-fs");
  const fsValue  = settingsBody.querySelector(".fs-value");
  const fsTicks  = settingsBody.querySelectorAll(".fs-tick");
  function applyFs(v) {
    item.fs = v;
    if (fsValue) fsValue.textContent = v.toFixed(2) + "×";
    fsTicks.forEach(t => t.classList.toggle("on", Math.abs(parseFloat(t.dataset.fs) - v) < 0.01));
    const itemEl = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"]`);
    if (itemEl) itemEl.dataset.fs = String(v);
  }
  if (fsSlider) {
    fsSlider.addEventListener("input", () => {
      const v = parseFloat(fsSlider.value);
      applyFs(v);
      saveState();
    });
  }
  if (fsTicks.length) {
    fsTicks.forEach(t => {
      t.addEventListener("click", () => {
        const v = parseFloat(t.dataset.fs);
        if (fsSlider) fsSlider.value = String(v);
        applyFs(v);
        saveState();
      });
    });
  }

  const sourcesBox = document.getElementById("f-sources");
  if (sourcesBox) {
    sourcesBox.addEventListener("click", e => {
      const c = e.target.closest(".chip");
      if (!c) return;
      const id = c.dataset.v;
      // determine current effective set
      const allIds = Object.keys(SOURCES);
      const currentlyOn = (item.cfg.enabledSources === undefined || item.cfg.enabledSources === null)
        ? new Set(allIds)
        : new Set(item.cfg.enabledSources);
      if (currentlyOn.has(id)) currentlyOn.delete(id);
      else currentlyOn.add(id);
      // if all on, set null; if all off, leave empty (will result in 0 news)
      if (currentlyOn.size === allIds.length) {
        item.cfg.enabledSources = null;
      } else {
        item.cfg.enabledSources = [...currentlyOn];
      }
      c.classList.toggle("on");
      saveState();
      mountPage();
    });
  }

  /* ============================================================
     Bus widget settings: search KMB stops, select, filter routes
     ============================================================ */
  if (item.type === "bus") {
    const searchInput = document.getElementById("f-bus-search");
    const searchAllBtn = document.getElementById("f-bus-search-all");
    const resultsBox = document.getElementById("f-bus-results");
    const currentName = document.getElementById("f-bus-current");
    const currentId = document.getElementById("f-bus-current-id");
    const routesBox = document.getElementById("f-bus-routes");

    let allStops = null;  // cache master stop list for session

    function renderStopResults(stops) {
      if (!stops || stops.length === 0) {
        resultsBox.innerHTML = `<div class="empty">冇結果。試下其他關鍵字或 stop ID。</div>`;
        return;
      }
      resultsBox.innerHTML = stops.slice(0, 50).map(s => `
        <div class="stop-row" data-stop="${s.stop}" data-name="${escapeHtml(s.name_tc || s.name_en || s.stop)}">
          <span class="stop-name">${escapeHtml(s.name_tc || s.name_en || s.stop)}</span>
          <span class="stop-id">${s.stop.slice(0, 8)}…</span>
        </div>
      `).join("");
      resultsBox.querySelectorAll(".stop-row").forEach(row => {
        row.addEventListener("click", () => {
          const sid = row.dataset.stop;
          const sname = row.dataset.name;
          item.cfg.stopId = sid;
          item.cfg.stopName = sname;
          item.cfg.routes = [];  // reset route filter when stop changes
          saveState();
          // Update displayed current stop
          if (currentName) currentName.textContent = sname;
          if (currentId) currentId.textContent = sid;
          // Update widget title
          const titleEl = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"] .title`);
          if (titleEl) titleEl.textContent = widgetTitle(item);
          // Show hint in routes box + trigger route fetch
          if (routesBox) routesBox.innerHTML = `<span class="hint" style="color:var(--muted-2);">載入路線中…</span>`;
          loadRoutesForStop(sid);
          // Remount widget body
          const itemEl = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"]`);
          if (itemEl) {
            const body = itemEl.querySelector(".body");
            if (body) {
              body.innerHTML = `<div style="color:var(--muted);padding:8px;">載入中…</div>`;
              const fakeEl = document.createElement('div');
              fillWidgetBody(item, body, fakeEl, itemEl);
              fakeEl.remove();
            }
          }
        });
      });
    }

    async function loadRoutesForStop(stopId) {
      try {
        const r = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${stopId}`, { cache: "no-store" });
        if (!r.ok) { if (routesBox) routesBox.innerHTML = `<span class="hint" style="color:var(--bad);">連線失敗 (HTTP ${r.status})</span>`; return; }
        const j = await r.json();
        const routes = Array.from(new Set((j.data || []).map(d => String(d.route)))).sort();
        if (routes.length === 0) {
          if (routesBox) routesBox.innerHTML = `<span class="hint" style="color:var(--muted-2);">此站未來冇班次</span>`;
          return;
        }
        const selected = item.cfg.routes || [];
        routesBox.innerHTML = routes.map(r => {
          const on = selected.length === 0 || selected.includes(r);
          return `<span class="chip ${on ? 'on' : ''}" data-route="${escapeHtml(r)}">${escapeHtml(r)}</span>`;
        }).join("");
        routesBox.querySelectorAll(".chip").forEach(chip => {
          chip.addEventListener("click", () => {
            const route = chip.dataset.route;
            // If all currently on (showing all), first click switches to "only this route"
            // If mix, toggle that one
            const allOn = routes.every(rr => {
              const sel = item.cfg.routes || [];
              return sel.length === 0 || sel.includes(rr);
            });
            if (allOn) {
              // transition: from "all" to "only route"
              item.cfg.routes = [route];
            } else {
              let sel = (item.cfg.routes || []).slice();
              if (sel.includes(route)) sel = sel.filter(x => x !== route);
              else sel.push(route);
              if (sel.length === routes.length) sel = [];  // back to all
              item.cfg.routes = sel;
            }
            saveState();
            // re-render chips
            routesBox.querySelectorAll(".chip").forEach(c => {
              const r = c.dataset.route;
              const on = item.cfg.routes.length === 0 || item.cfg.routes.includes(r);
              c.classList.toggle("on", on);
            });
            // remount widget body to apply filter
            const itemEl = gridEl.querySelector(`.grid-stack-item[data-id="${item.id}"]`);
            if (itemEl) {
              const body = itemEl.querySelector(".body");
              if (body) {
                body.innerHTML = `<div style="color:var(--muted);padding:8px;">載入中…</div>`;
                const fakeEl = document.createElement('div');
                fillWidgetBody(item, body, fakeEl, itemEl);
                fakeEl.remove();
              }
            }
          });
        });
      } catch (e) {
        if (routesBox) routesBox.innerHTML = `<span class="hint" style="color:var(--bad);">載入失敗: ${escapeHtml(String(e.message || e))}</span>`;
      }
    }

    async function searchStops() {
      if (!searchInput) return;
      const q = (searchInput.value || "").trim().toLowerCase();
      if (q.length === 0) {
        resultsBox.innerHTML = `<div class="loading">輸入關鍵字搜尋…</div>`;
        return;
      }
      // Load master list once (lazy)
      if (!allStops) {
        resultsBox.innerHTML = `<div class="loading">載入 KMB 巴士站 master list…</div>`;
        try {
          const r = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop`, { cache: "no-store" });
          if (!r.ok) { resultsBox.innerHTML = `<div class="empty">HTTP ${r.status}</div>`; return; }
          const j = await r.json();
          allStops = j.data || [];
        } catch (e) {
          resultsBox.innerHTML = `<div class="empty">Master list 載入失敗: ${escapeHtml(String(e.message || e))}</div>`;
          return;
        }
      }
      const filtered = allStops.filter(s => {
        const name = `${s.name_tc || ""} ${s.name_sc || ""} ${s.name_en || ""} ${s.stop}`.toLowerCase();
        return name.includes(q);
      });
      renderStopResults(filtered);
    }

    if (searchInput) {
      let timer = null;
      searchInput.addEventListener("input", () => {
        clearTimeout(timer);
        timer = setTimeout(searchStops, 250);
      });
    }
    if (searchAllBtn) {
      searchAllBtn.addEventListener("click", () => {
        if (!searchInput) return;
        searchInput.value = "";
        searchStops();
      });
    }

    // If we already have a stop selected, populate routes box on settings open
    if (item.cfg.stopId) {
      if (routesBox) routesBox.innerHTML = `<span class="hint" style="color:var(--muted-2);">載入路線中…</span>`;
      loadRoutesForStop(item.cfg.stopId);
    }
  }
}

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ============================================================
   Gridlines — match GridStack's exact cellWidth/cellHeight
   ============================================================ */
function drawGridlines() {
  if (!grid) return;
  const eng = grid.engine;
  if (!eng) return;
  const cols = eng.column || 12;
  const widgetEl = Array.from(gridEl.querySelectorAll('.grid-stack-item'))
    .find(it => !it.classList.contains('grid-stack-placeholder'));
  let colStep;
  if (widgetEl) {
    // Measure column step from an actual rendered widget: width / gs-w
    const wAttr = +widgetEl.getAttribute('gs-w') || 1;
    const wPx = widgetEl.getBoundingClientRect().width;
    colStep = wPx / wAttr;
  } else {
    colStep = gridEl.getBoundingClientRect().width / cols;
  }
  drawWith(colStep, cols);
}

function drawWith(colStep, cols) {
  // Remove old lines
  gridEl.querySelectorAll('.gs-line').forEach(el => el.remove());
  // Draw vertical lines at left edge of every column (= c * colStep)
  for (let c = 0; c <= cols; c++) {
    const x = c * colStep;
    const line = document.createElement('div');
    line.className = 'gs-line v';
    line.style.left = x + 'px';
    gridEl.appendChild(line);
  }
  // Row lines — based on content extent; cellH is rendered as gs-h * (cellH+margin)
  // We can derive cellH+margin from any widget height / its gs-h
  let rowStep = 60; // default
  const sample = gridEl.querySelector('.grid-stack-item:not(.grid-stack-placeholder)');
  if (sample) {
    const hAttr = +sample.getAttribute('gs-h') || 1;
    const hPx = sample.getBoundingClientRect().height;
    rowStep = hPx / hAttr;
  }
  let maxRows = 12;
  grid.engine.nodes.forEach(n => { if (n.y + n.h > maxRows) maxRows = n.y + n.h; });
  for (let r = 1; r < maxRows + 4; r++) {
    const y = r * rowStep;
    const line = document.createElement('div');
    line.className = 'gs-line h';
    line.style.top = y + 'px';
    gridEl.appendChild(line);
  }
  const minH = (maxRows + 2) * rowStep;
  gridEl.style.minHeight = minH + 'px';
}

/* ============================================================
   Auto-arrange (compact)
   ============================================================ */
document.getElementById("arrangeBtn").addEventListener("click", () => {
  if (!grid) return;
  // save current sizes back into state first
  grid.engine.nodes.forEach(n => {
    const it = currentPage().items.find(x => x.id === n.id);
    if (it) { it.x = n.x; it.y = n.y; it.w = n.w; it.h = n.h; }
  });
  // pack items by w desc, place greedily
  const items = currentPage().items.slice().sort((a,b) => (b.w*b.h) - (a.w*a.h));
  const placed = []; // {id, x, y, w, h}
  function fits(x, y, w, h) {
    if (x + w > COLS) return false;
    for (const p of placed) {
      if (x < p.x + p.w && x + w > p.x && y < p.y + p.h && y + h > p.y) return false;
    }
    return true;
  }
  items.forEach(it => {
    let found = false;
    for (let y = 0; y < 200 && !found; y++) {
      for (let x = 0; x + it.w <= COLS && !found; x++) {
        if (fits(x, y, it.w, it.h)) {
          placed.push({ id: it.id, x, y, w: it.w, h: it.h });
          it.x = x; it.y = y;
          found = true;
        }
      }
    }
  });
  saveState();
  mountPage();
});

/* ============================================================
   Boot
   ============================================================ */
function applyAppearance() {
  document.body.classList.toggle("light", state.mode === "light");
  // theme: remove all theme-* then add the active one
  ["emerald","rose","amber","cyan","slate"].forEach(t => document.body.classList.remove("theme-" + t));
  if (state.theme) document.body.classList.add("theme-" + state.theme);
  // font family
  document.body.classList.remove("font-serif","font-mono");
  if (state.font === "serif") document.body.classList.add("font-serif");
  if (state.font === "mono")  document.body.classList.add("font-mono");
  // font size
  document.body.classList.remove("fs-compact","fs-spacious","fs-roomy");
  if (state.fontSize === "compact")  document.body.classList.add("fs-compact");
  if (state.fontSize === "spacious") document.body.classList.add("fs-spacious");
  if (state.fontSize === "roomy")    document.body.classList.add("fs-roomy");
  // mode button label
  const modeBtn = document.getElementById("modeBtn");
  if (modeBtn) modeBtn.textContent = state.mode === "light" ? "☀️" : "🌙";
}
applyAppearance();

// Mode toggle (dark / light)
document.getElementById("modeBtn").addEventListener("click", () => {
  state.mode = state.mode === "light" ? "dark" : "light";
  saveState(); applyAppearance();
});

// Theme picker
document.querySelectorAll('#themeMenu .menu-item').forEach(item => {

/* ============================================================
   Responsive sizing via ResizeObserver
   Sets data-size on each widget item so CSS can switch layouts.
   ============================================================ */
const WIDGET_SIZE_BREAKS = {
  clock:  { tiny: 160, narrow: 260, wide: 500 },
  weather:{ tiny: 180, narrow: 320, wide: 560, xlarge: 800 },
  news:   { tiny: 200, narrow: 340, wide: 700, xlarge: 900 },   // wide = 2-col, xlarge = 3-col
  note:   { tiny: 160, narrow: 320, wide: 600 },
};
function applyWidgetSize(itemEl) {
  if (!itemEl || !itemEl.classList) return;
  const w = itemEl.getBoundingClientRect().width;
  let type = null;
  for (const c of itemEl.classList) {
    if (c.startsWith("w-") && c !== "w-news" && c !== "w-note" && c !== "w-clock" && c !== "w-weather") continue;
  }
  if (itemEl.classList.contains("w-clock"))    type = "clock";
  if (itemEl.classList.contains("w-weather"))  type = "weather";
  if (itemEl.classList.contains("w-news"))     type = "news";
  if (itemEl.classList.contains("w-note"))     type = "note";
  if (!type) return;
  const br = WIDGET_SIZE_BREAKS[type];
  let size;
  if (w < br.tiny) size = "tiny";
  else if (w < br.narrow) size = "narrow";
  else if (w < br.wide) size = "normal";
  else if (w < (br.xlarge || 99999)) size = "wide";
  else size = "xlarge";
  itemEl.dataset.size = size;
}
const widgetRO = new ResizeObserver(entries => {
  for (const e of entries) {
    applyWidgetSize(e.target);
    // Force tiny/narrow widget to fit content height (no scrollbar).
    // GridStack float mode can leave widgets taller than necessary.
    const item = e.target;
    const w = item.getBoundingClientRect().width;
    if (w < 200 && item.dataset.size === "tiny") {
      const bodyH = item.querySelector(".widget .body")?.scrollHeight || 0;
      const naturalH = bodyH + 8; // padding + border
      const curH = item.offsetHeight;
      if (curH > naturalH + 4) {
        item.style.minHeight = naturalH + "px";
      } else {
        item.style.minHeight = "";
      }
    } else {
      item.style.minHeight = "";
    }
  }
});
// Observe all current + future widget items via MutationObserver
function watchWidgets() {
  document.querySelectorAll(".grid-stack-item").forEach(el => {
    if (!el.dataset.sizeObserved) {
      widgetRO.observe(el);
      el.dataset.sizeObserved = "1";
      applyWidgetSize(el);
    }
  });
}
const gridObserver = new MutationObserver(() => {
  document.querySelectorAll(".grid-stack-item").forEach(el => {
    if (!el.dataset.sizeObserved) {
      widgetRO.observe(el);
      el.dataset.sizeObserved = "1";
      applyWidgetSize(el);
    }
  });
});
gridObserver.observe(gridEl, { childList: true, subtree: false });
watchWidgets();
</script>
